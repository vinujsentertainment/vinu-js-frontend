function renderCats(){
  document.getElementById('catContainer').innerHTML = categories.map(c=> 
    `<button onclick="filterCat('${c}', this)" class="cat-btn ${currentCat===c?'bg-white text-black font-bold':'bg-[#1c1f36]'} px-4 py-1.5 rounded-full text-sm whitespace-nowrap">${c}</button>`
  ).join('');
}

function render(){
  document.getElementById('wallet').innerText = wallet;
  const list = document.getElementById('appList');
  list.innerHTML = '';
  apps.filter(a => currentCat==='All' || a.cat===currentCat).forEach(app=>{
    const isDone = claimed.includes(app.id);
    list.innerHTML += `
    <div class="bg-[#1c1f36] p-3 rounded-xl flex justify-between items-center border border-white/5">
      <div><h3 class="font-bold">${app.name}</h3><p class="text-xs text-gray-400">${app.cat} • ₹${app.reward}</p></div>
      <button id="btn-${app.id}" onclick="startTask(${app.id})" class="${isDone?'bg-gray-700 text-gray-400':'bg-green-500 text-black'} px-4 py-2 rounded-lg text-sm font-bold" ${isDone?'disabled':''}>${isDone?'Claimed':'Earn ₹'+app.reward}</button>
    </div>`;
  });
}

function filterCat(cat, el){
  currentCat = cat;
  renderCats();
  render();
}
