<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VJ VINUJS SUPER - 500 Real Apps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0d0a1e;color:#fff;padding-bottom:80px}
.header{position:sticky;top:0;z-index:99;background:#16112c;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2545}
.badge{background:linear-gradient(90deg,#ffcc00,#ffb700);color:#000;padding:5px 14px;border-radius:20px;font-weight:900}
.tabs{position:sticky;top:58px;z-index:98;background:#0d0a1e;padding:10px;display:flex;gap:8px;overflow:auto;white-space:nowrap;border-bottom:1px solid #1e1a33}
.tabs div{padding:8px 16px;border-radius:20px;background:#1e1938;border:1px solid #3a3460;font-size:12px}
.tabs div.active{background:linear-gradient(90deg,#ff2a8a,#7a3bff);border:none}
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app{background:#1a1540;border:1px solid #2d2750;border-radius:16px;padding:10px;text-align:center}
.app img{width:52px;height:52px;border-radius:12px;background:#fff;object-fit:contain;padding:4px}
.app b{font-size:12px;display:block;margin:6px 0 2px 0;height:28px;overflow:hidden}
.app small{font-size:10px;color:#8e88b0;display:block;margin-bottom:8px}
.app button{width:100%;padding:8px;border:none;border-radius:10px;background:linear-gradient(90deg,#ff2a8a,#7a3bff);color:#fff;font-weight:700;font-size:12px}
.search{margin:10px;background:#1a1540;border:1px solid #2d2750;border-radius:12px;padding:10px;display:flex;gap:8px}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
</style>
</head><body>

<div class="header">
<div><div style="font-weight:900;color:#ffcc00">VJ VINUJS SUPER</div><small style="color:#9a90b8;font-size:10px">500 Apps • Secure</small></div>
<div class="badge" id="bal">₹0.00</div>
</div>

<div class="tabs" id="tabs"></div>
<div class="search"><span>🔍</span><input id="q" placeholder="Search 500 apps..." oninput="render()"></div>
<div class="grid" id="list"></div>

<script>
const API="https://vinu-js-backend.onrender.com";
const userId=localStorage.getItem('vj')||'VJ_'+Date.now(); localStorage.setItem('vj',userId);
const CATS=["All","Social","Entertainment","Games","Shopping","Finance","Tools","Video"];

// REAL DOMAIN LIST - Isse icon real aayega, 'f' nahi
const REAL = {
"Facebook":"facebook.com","Instagram":"instagram.com","WhatsApp":"whatsapp.com","Telegram":"telegram.org","Snapchat":"snapchat.com","ShareChat":"sharechat.com","Moj":"mojapp.in","Josh":"myjosh.in","Chingari":"chingari.io","Roposo":"roposo.com",
"YouTube":"youtube.com","Hotstar":"hotstar.com","Netflix":"netflix.com","MX Player":"mxplayer.in","JioSaavn":"jiosaavn.com","Spotify":"spotify.com","Gaana":"gaana.com","Kuku FM":"kukufm.com","Rigi":"rigi.club",
"Ludo King":"ludoking.com","Dream11":"dream11.com","WinZO":"winzogames.com","MPL":"mpl.live","Zupee":"zupee.com","Rummy Circle":"rummycircle.com",
"Flipkart":"flipkart.com","Amazon":"amazon.in","Meesho":"meesho.com","Myntra":"myntra.com",
"PhonePe":"phonepe.com","Google Pay":"pay.google.com","Paytm":"paytm.com","Gullak":"gullak.app","CRED":"cred.club","True Balance":"truebalance.io"
};

let APPS=[];
let idx=0;
for(let name in REAL){
  for(let v=0; v<12; v++){
    let c = v%2==0? (name==="Facebook"||name==="Instagram"? "Social" : name==="YouTube"? "Video" : "Games") : CATS[2+ (idx%5)];
    APPS.push({id:++idx, name: v==0?name : `${name} ${v+1}`, cat: idx<20? CATS[idx%CATS.length] : c, domain: REAL[name], reward: idx<=14? (idx<=5?15:5):0 });
  }
}
// 500 tak pura karo
while(APPS.length<500){ let k=Object.keys(REAL)[APPS.length%Object.keys(REAL).length]; APPS.push({id:APPS.length+1,name:`${k} ${APPS.length}`,cat:CATS[APPS.length%CATS.length],domain:REAL[k],reward:0}); }

let cur="All";
function renderTabs(){
  document.getElementById('tabs').innerHTML=CATS.map(c=>`<div class="${cur===c?'active':''}" onclick="cur='${c}';render()">${c} ${c==='All'?`(${APPS.length})`:''}</div>`).join('');
}
function render(){
  renderTabs();
  let q=document.getElementById('q').value.toLowerCase();
  let list=APPS.filter(a=> (cur==='All'||a.cat===cur) && a.name.toLowerCase().includes(q)).slice(0,100);
  document.getElementById('list').innerHTML=list.map(a=>`
    <div class="app">
      <img src="https://www.google.com/s2/favicons?domain=${a.domain}&sz=128"
           onerror="this.src='https://logo.clearbit.com/${a.domain}?size=128'"
           loading="lazy">
      <b>${a.name}</b>
      <small>${a.cat} • ${a.reward>0?'Earning':''}</small>
      ${a.reward>0?`<button onclick="earn('${a.domain}',${a.reward})">Earn ₹${a.reward}</button>`:`<button style="background:#2a2545" onclick="window.open('https://play.google.com/store/search?q=${a.name}','_blank')">Open</button>`}
    </div>
  `).join('');
}

async function earn(domain,amt){
  if(!confirm(domain+" - 15 sec ad dekho, ₹"+amt+" milega?")) return;
  const sig=domain+"_"+Date.now();
  try{
    const r=await fetch(API+"/api/reward/verify",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,network:'admob',reward:amt,signature:sig})});
    const d=await r.json(); if(d.success){ alert("₹"+amt+" mil gaya"); loadBal(); } else alert(d.message);
  }catch(e){ alert("Backend connect nahi - Render URL check karo"); }
}
async function loadBal(){ try{ const r=await fetch(API+"/api/wallet/"+userId); const d=await r.json(); document.getElementById('bal').innerText="₹"+(d.balance||0).toFixed(2);}catch(e){} }

render(); loadBal();
</script>
</body></html>
