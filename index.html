<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VINU JS - Earning OTT</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.header{background:#111;padding:15px;display:flex;justify-content:space-between;align-items:center}
.wallet{background:linear-gradient(45deg,gold,orange);color:#000;padding:15px;border-radius:15px;margin:15px}
.btn{background:#ff0055;color:#fff;border:none;padding:10px 15px;border-radius:8px;margin:5px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.card{background:#222;border-radius:10px;overflow:hidden}
.card img{width:100%;height:150px;object-fit:cover}
.card div{padding:10px}
</style>
</head>
<body>
<div class="header">
  <b>VINU JS OTT</b>
  <span id="user">Vinod</span>
</div>

<div class="wallet">
  <h3 style="margin:0">💰 Wallet: <span id="balance">₹0</span></h3>
  <p style="margin:5px 0">Coins: <span id="coins">0</span> | Refer: <b id="referCode">LOADING</b></p>
  <button class="btn" onclick="dailyReward()">Daily 10 Coins</button>
  <button class="btn" onclick="shareRefer()" style="background:#25D366">Refer & Earn 50 Coins</button>
</div>

<div class="grid" id="movies"></div>

<script>
const API = "https://vinu-js-backend.onrender.com";
let mobile = localStorage.getItem("mobile");
if(!mobile){ mobile = "9685" + Math.floor(10000000*Math.random()); localStorage.setItem("mobile", mobile); }

async function load(){
  let r = await fetch(API+"/api/movies"); let list = await r.json();
  let html="";
  list.forEach(m=>{
    html+=`<div class="card"><img src="${m.poster}"><div><b>${m.title}</b><br><small>${m.year}</small><br><button class="btn" onclick="watchMovie(${m.id})">▶ Watch & Earn 5 Coins</button></div></div>`;
  });
  document.getElementById("movies").innerHTML=html;
  showWallet();
}
async function showWallet(){
  try{
    let r = await fetch(API+"/api/wallet/"+mobile); let d = await r.json();
    document.getElementById("coins").innerText = d.coins || 0;
    document.getElementById("balance").innerText = "₹"+Math.floor((d.coins||0)/2);
    document.getElementById("referCode").innerText = d.referral_code || "VINU0000";
  }catch(e){}
}
async function dailyReward(){
  await fetch(API+"/api/reward/daily",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile})});
  alert("10 Coins Added! ✅"); showWallet();
}
async function watchMovie(id){
  await fetch(API+"/api/reward/watch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile,movieId:id})});
  alert("Video Dekha - 5 Coins Mile! 💰"); showWallet();
  window.open(API+"/api/movies","_blank");
}
function shareRefer(){
  let code = document.getElementById("referCode").innerText;
  let msg = `Vinu JS OTT Join Karo! Mera Refer Code: ${code} - 25 Coins Free! Link: https://github.com/vinujsentertainment/vinu-js-frontend`;
  window.open("https://wa.me/?text="+encodeURIComponent(msg));
}
load();
</script>
</body>
</html>
