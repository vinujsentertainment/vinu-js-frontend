<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VINOD AVJS FINAL</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff}header{background:#111;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}header h2{color:#00ff88}#balHead{background:#00ff88;color:#000;padding:5px 12px;border-radius:20px;font-weight:bold}.tabs{display:flex;background:#111;position:sticky;top:54px;z-index:9}.tabs button{flex:1;padding:12px;background:none;border:none;color:#777;font-weight:bold;border-bottom:2px solid transparent}.tabs button.active{color:#00ff88;border-color:#00ff88}.page{display:none;padding:12px}.page.active{display:block}.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{background:#1c1c1c;padding:16px;border-radius:12px;border:1px solid #222;text-align:center}.app{background:#181818;border:1px solid #222;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:8px}.app img{width:48px;height:48px;border-radius:10px;background:#fff}.wallet-card{background:linear-gradient(135deg,#00ff88,#00ccff);color:#000;padding:20px;border-radius:16px;text-align:center}.form{background:#181818;padding:15px;border-radius:12px;margin-top:12px;border:1px solid #222}.form input{width:100%;padding:12px;border-radius:8px;border:none;background:#222;color:#fff;margin:6px 0}.form button{width:100%;padding:12px;background:#00ff88;border:none;border-radius:8px;font-weight:bold}</style>
</head><body>
<header><h2>💰 VINOD AVJS</h2><div id="balHead">₹0</div></header>
<div class="tabs"><button id="t-home" class="active" onclick="openPage('home')">HOME</button><button id="t-earn" onclick="openPage('earn')">EARN</button><button id="t-wallet" onclick="openPage('wallet')">WALLET</button><button id="t-admin" onclick="openPage('admin')">ADMIN</button></div>
<div id="page-home" class="page active"><h3>Category Wise</h3><div class="cat-grid" style="margin-top:10px">
<div class="cat" onclick="openCategory('Social')"><b>Social</b><br>62 Apps<br><small style="color:#00ff88">3 Earning</small></div>
<div class="cat" onclick="openCategory('Finance')"><b>Finance</b><br>52 Apps<br><small style="color:#00ff88">2 Earning</small></div>
<div class="cat" onclick="openCategory('Shopping')"><b>Shopping</b><br>60 Apps<br><small style="color:#00ff88">1 Earning</small></div>
<div class="cat" onclick="openCategory('Games')"><b>Games</b><br>68 Apps<br><small style="color:#00ff88">2 Earning</small></div>
<div class="cat" onclick="openCategory('Video')"><b>Video</b><br>38 Apps</div>
<div class="cat" onclick="openCategory('Tools')"><b>Tools</b><br>30 Apps<br><small style="color:#00ff88">1 Earning</small></div>
<div class="cat" onclick="openCategory('All')" style="grid-column: span 2;background:#00ff88;color:#000"><b>All 310 Apps Dekhein</b></div>
</div></div>
<div id="page-earn" class="page"><div id="filterInfo" style="margin-bottom:10px;color:#00ff88;font-weight:bold"></div><div id="appList"></div></div>
<div id="page-wallet" class="page"><div class="wallet-card"><h1 id="bigBal">₹0</h1><p>Balance - Min ₹100</p></div><div class="form"><input id="upi" placeholder="UPI ID"><input id="amt" type="number" placeholder="100"><button onclick="doWithdraw()">Withdraw Now</button><p id="wMsg"></p></div></div>
<div id="page-admin" class="page"><div class="form"><input id="adminKey" type="password" placeholder="VINOD123"><button onclick="loadAdmin()">Load</button></div><div id="adminBody"></div></div>

<script>
const API_BASE = "https://vinu-js-backend.onrender.com";
const EARNING_IDS = [1, 5, 12, 28, 45, 77, 102, 150, 210]; // SIRF YE 9 APPS EARNING DENGE

// 310 UNIQUE APP NAMES - KOI REPEAT NAHI
const NAMES = {
Social: ["WhatsApp","Instagram","Facebook","Telegram","Snapchat","ShareChat","Moj","Josh","Chingari","Twitter","LinkedIn","Discord","Hike","WeChat","Signal","Truecaller","Helo","Roposo","Trell","Clubhouse","Koo","Bottim","Public","Wink","LitLot","Vero","Threads","BeReal","Yubo","Wizz","Hoop","OmeTV","Azar","Holla","Tango","Bigo Live","Likee","Triller","Dubsmash","Lomotif","Funimate","Zili","Snack Video","MX TakaTak","Mitron","Chillr","VoxUp","Leher","Saro","Frnd","Eloelo","Woo","Aisle","Shaadi.com","BharatMatrimony","Jeevansathi","Tinder","Bumble","OkCupid","Happn","Aha"],
Finance: ["PhonePe","Google Pay","Paytm","BHIM UPI","CRED","Mobikwik","Freecharge","Airtel Thanks","Jio Finance","Navi","Groww","Zerodha Kite","Upstox","Angel One","5paisa","ET Money","Paytm Money","Fibe","Kissht","MoneyTap","Branch","KreditBee","LazyPay","Simpl","Slice","Uni Cards","OneCard","Fi Money","Jupiter","Niyo","FamPay","Akudo","Walrus","Digibank","Kotak 811","SBI YONO","HDFC PayZapp","ICICI iMobile","Axis Mobile","IndusMobile","BOB World","Canara ai1","IDFC First","Federal Bank","Yes Pay","KVB","PNB One","Union Bank","Bank of Baroda","Federal One","Slice Mini"],
Shopping: ["Amazon","Flipkart","Meesho","Myntra","Ajio","Nykaa","Nykaa Fashion","Bewakoof","Snapdeal","ShopClues","Pepperfry","Lenskart","FirstCry","Mamaearth","Boat","Noise","Zouk","Zudio","Urbanic","SHEIN","Limeroad","Tata Neu","JioMart","BigBasket","Blinkit","Zepto","Instamart","Dunzo","Freshtohome","Licilious","MilkBasket","DealShare","CityMall","GlowRoad","ShopX","Udaan","Bik.ai","DotPe","Dukaan","MyStore","Jiomart Partner","Amazon Seller","Flipkart Seller","Meesho Supplier","GlowRoad Resell","EarnKaro","CashKaro","Shop101","Vokal Shop","Bunny Basket","ChicCheck","StyleUp","Fashion Factory","Trends","Max Fashion","Pantaloons","Lifestyle","Shoppers Stop","Central"],
Games: ["Ludo King","Ludo Supreme","Dream11","MPL","WinZO","Zupee","Rush","A23 Games","PokerBaazi","Adda52","My11Circle","Howzat","Vision11","Gamezy","BalleBaazi","PlayerzPot","Fantasy Akhada","MyTeam11","Real11","HalaPlay","Ludo Empire","Carrom Pool","8 Ball Pool","Candy Crush","Subway Surfers","Temple Run","Free Fire","BGMI","Call of Duty","Clash of Clans","Clash Royale","Hay Day","Brawl Stars","Among Us","Roblox","Minecraft","GTA Vice City","Hill Climb Racing","Dr Driving","Traffic Rider","Bike Race","Car Parking","Bus Simulator","Train Simulator","Truck Simulator","Flight Pilot","Chess","Sudoku","Bubble Shooter","Fruit Ninja","Talking Tom","Angry Birds","Cut the Rope","Plants vs Zombies","Asphalt 9","Need for Speed","WCC3","Real Cricket 22","FIFA Mobile","eFootball","Top Eleven","Score Hero","Mini Militia","Bomb Squad","Free Fire Max","BGMI Lite","Ludo Party","Snake Game"],
Video: ["YouTube","YouTube Music","MX Player","VLC","JioCinema","Hotstar","Netflix","Prime Video","Zee5","SonyLIV","ALTBalaji","ULLU","Kuku FM","AudioBook","Gaana","JioSaavn","Wynk","Spotify","Hungama","Resso","Reels","Josh Video","Moj Video","Chingari Video","Roposo Video","ShareChat Video","Dailyhunt","Public Video","Voot","Aha Video","Hoichoi","ShemarooMe","Eros Now","Discovery+","Sun NXT","ManoramaMAX","ETV Win","Stage","Chaupal","NammaFlix","Tarang Plus","Raj TV","Sunnxt Movies"],
Tools: ["Google Files","ShareIt","Xender","MX Share","Clean Master","Phone Cleaner","Battery Saver","VPN Master","Turbo VPN","Super VPN","UC Browser","Opera Mini","Chrome","Firefox","Brave","PicsArt","Canva","Snapseed","Lightroom","VN Editor","Kinemaster","InShot","YouCut","Filmora","PhotoRoom","Remini","FaceApp","Adobe Scan","CamScanner","Microsoft Office","Google Docs","Google Lens","Translate","Gboard","Truecaller Premium","Call Recorder","Screen Recorder","AZ Recorder","DU Recorder","Game Booster"]
};

const APP_DATA = [];
let globalId = 1;
for(let cat in NAMES){
  NAMES[cat].forEach(name=>{
    let isEarn = EARNING_IDS.includes(globalId);
    // Unique icon for every app using initials - kabhi repeat nahi
    let icon = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff&size=128&bold=true`;
    APP_DATA.push({id:globalId, name:name, c:cat, pkg:"com.vinod."+name.toLowerCase().replace(/[^a-z]/g,''), icon:icon, reward: isEarn? (globalId%2==0?10:5) : 0, isEarn:isEarn });
    globalId++;
  });
}

const userId=localStorage.getItem('earn_user')||'USER_'+Math.floor(Math.random()*900000+100000); localStorage.setItem('earn_user',userId);
let curCat='All';
function openPage(p){ document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active')); document.getElementById('page-'+p).classList.add('active'); document.getElementById('t-'+p).classList.add('active'); if(p==='earn') renderApps(curCat); updateBal(); }
function openCategory(c){ curCat=c; openPage('earn'); }
function renderApps(cat){
  document.getElementById('filterInfo').innerText = cat==='All'? `All 310 Unique Apps - Sirf ${EARNING_IDS.length} par Earning` : `${cat} - ${NAMES[cat].length} Unique Apps`;
  let f = cat==='All'? APP_DATA : APP_DATA.filter(a=>a.c===cat);
  document.getElementById('appList').innerHTML = f.map(a=>{
    return `<div class="app"><img src="${a.icon}"><div style="flex:1"><b>${a.name}</b><br><small>${a.c} ${a.isEarn?'• Earning App':''}</small></div>${a.isEarn? `<button style="background:#00ff88;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:bold" onclick="claimApp(${a.id},'${a.pkg}')">Earn ₹${a.reward}</button>` : `<button style="background:#222;color:#888;border:1px solid #333;padding:8px 14px;border-radius:20px" onclick="window.open('https://play.google.com/store/search?q=${a.name}&c=apps','_blank')">Install</button>`}</div>`;
  }).join('');
}
async function updateBal(){ try{ const r=await fetch(API_BASE+'/api/wallet/'+userId); const d=await r.json(); document.getElementById('balHead').innerText='₹'+d.balance; document.getElementById('bigBal').innerText='₹'+d.balance; }catch(e){} }
async function claimApp(appId,pkg){ window.open('https://play.google.com/store/search?q='+pkg,'_blank'); if(!confirm('Install kiya? OK par click karne se earning milegi')) return; const res=await fetch(API_BASE+'/api/tasks/verify-ad',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,appId,adWatched:true})}); const data=await res.json(); alert(data.success?`₹${data.reward} Mila! Balance: ₹${data.newBalance}`:data.message); updateBal(); }
async function doWithdraw(){ const upi=document.getElementById('upi').value; const amt=parseInt(document.getElementById('amt').value); const res=await fetch(API_BASE+'/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,upiId:upi,amount:amt})}); const d=await res.json(); document.getElementById('wMsg').innerText=d.message||d.error; updateBal(); }
async function loadAdmin(){ const key=document.getElementById('adminKey').value; const r=await fetch(API_BASE+'/api/admin/withdrawals?key='+key); const data=await r.json(); document.getElementById('adminBody').innerHTML=data.map(x=>`ID:${x.id} User:${x.user_id} ₹${x.amount} UPI:${x.upi_id} ${x.status}`).join('<br>'); }
updateBal(); renderApps('All');
</script></body></html>
