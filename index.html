<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROYAL KING Earning</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f0f0f;color:#fff}.h{padding:14px;background:#1a1a1a;display:flex;justify-content:space-between;position:sticky;top:0}.w{background:#FFD700;color:#000;padding:6px 12px;border-radius:20px;font-weight:700}.tabs{display:flex;gap:8px;padding:10px;background:#111;overflow:auto}.tab{padding:8px 14px;border-radius:20px;background:#222;cursor:pointer}.tab.active{background:#FFD700;color:#000}.card{background:#1e1e1e;margin:10px;border-radius:12px;padding:14px}.btn{background:#FFD700;color:#000;border:none;padding:10px;border-radius:8px;font-weight:700;width:100%;margin-top:8px}</style></head><body>
<div class="h"><div style="color:#FFD700;font-weight:900">👑 ROYAL KING</div><div class="w" id="wb">₹0 | 100 Coins</div></div>
<div class="tabs"><div class="tab active" onclick="tab('home',this)">🏠 Home</div><div class="tab" onclick="tab('earn',this)">💰 Earn</div><div class="tab" onclick="tab('wallet',this)">👛 Wallet</div><div class="tab" onclick="tab('refer',this)">👥 Refer</div></div>
<div id="home" class="sec"><div class="card"><h3>🔥 Apps & Stories</h3><div id="clist"></div></div></div>
<div id="earn" class="sec" style="display:none"><div class="card"><h3>Daily Bonus</h3><button class="btn" onclick="earn('daily')">Claim ₹2 + 10 Coins</button></div><div class="card"><h3>Rewarded Ad</h3><button class="btn" onclick="ad()">Watch Ad +20 Coins</button></div><div class="card"><h3>Spin</h3><button class="btn" onclick="earn('spin')">Spin +25 Coins</button></div><div class="card"><h3>Tasks - 500+ Apps</h3><button class="btn" onclick="earn('task')">Open App +10 Coins</button></div></div>
<div id="wallet" class="sec" style="display:none"><div class="card"><h1 id="b2">₹0</h1><p>Coins: <span id="c2">100</span></p><input id="upi" placeholder="UPI ID" style="width:100%;padding:10px;border-radius:8px;border:none;margin-top:8px"><button class="btn" onclick="wd()">Withdraw Min 200 Coins + 5 Refer</button><p id="msg"></p></div><div class="card"><div id="tx"></div></div></div>
<div id="refer" class="sec" style="display:none"><div class="card"><h3>Refer Code: <b id="rc">...</b></h3><p>Total Refer: <span id="rcnt">0</span></p><input id="refin" placeholder="Referral code" style="width:100%;padding:10px;border-radius:8px;border:none;margin-top:8px"><button class="btn" onclick="ref()">Apply Code</button></div></div>
<script>
const BACK='https://vinu-js-backend.onrender.com';let UID=localStorage.getItem('rk_uid');if(!UID){UID='USER_'+Date.now();localStorage.setItem('rk_uid',UID);}
async function load(){let r=await fetch(BACK+'/api/wallet/'+UID);let d=await r.json();document.getElementById('wb').innerText=`₹${d.balance} | ${d.coins} Coins`;document.getElementById('b2').innerText=`₹${d.balance}`;document.getElementById('c2').innerText=d.coins;document.getElementById('rc').innerText=d.referral_code;document.getElementById('rcnt').innerText=d.referrals;let r2=await fetch(BACK+'/api/history/'+UID);let d2=await r2.json();document.getElementById('tx').innerHTML=(d2.transactions||[]).map(t=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #333;padding:4px 0"><span>${t.type}</span><span>+${t.coins}c</span></div>`).join('');let r3=await fetch(BACK+'/api/content');let d3=await r3.json();document.getElementById('clist').innerHTML=d3.map(c=>`<div style="background:#2a2a2a;padding:8px;margin:5px 0;border-radius:8px">${c.thumb} ${c.title} <button style="float:right;background:#FFD700;border:none;padding:4px 8px;border-radius:6px" onclick="earn('content')">Open</button></div>`).join('');}
async function earn(t){let r=await fetch(BACK+'/api/earn/'+t,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:UID})});let d=await r.json();alert(d.message||`+${d.coins} Coins`);load();}
async function ad(){let tx='TX_'+Date.now()+'_'+UID;let r=await fetch(BACK+'/api/admob/ssv?user_id='+UID+'&transaction_id='+tx);alert(await r.text());load();}
function tab(id,el){document.querySelectorAll('.sec').forEach(s=>s.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');load();}
async function ref(){let c=document.getElementById('refin').value;let r=await fetch(BACK+'/api/referral/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:UID,referralCode:c})});alert((await r.json()).message);load();}
async function wd(){let u=document.getElementById('upi').value;let r=await fetch(BACK+'/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:UID,upi:u,coins:200})});document.getElementById('msg').innerText=(await r.json()).message;load();}
load();
</script></body></html>
