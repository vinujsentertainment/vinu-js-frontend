function collectMoney(){clearInterval(timer); document.getElementById("running").style.display="none"; if(curApp){usage[curApp]=(usage[curApp]||0)+1; update(); alert("✅ "+curApp+" - "+sec+" sec | ₹"+curReward+" Added!");} curApp=null;}
function update(){
localStorage.setItem("vls_bal",bal);localStorage.setItem("vls_coins",coins);localStorage.setItem("vls_total",total);localStorage.setItem("vls_use",JSON.stringify(usage));localStorage.setItem("vls_w",JSON.stringify(wds));localStorage.setItem("vls_play",playEarn);localStorage.setItem("vls_task",taskEarn);
document.getElementById("coins").innerText=coins;
document.getElementById("eTotal").innerText="₹"+bal; document.getElementById("eCode").innerText="Code: "+code;
document.getElementById("eDetail").innerHTML=`PLAY: ₹${playEarn} | Task: ₹${taskEarn} | Total: ₹${total} | MD: ₹${Math.floor(total*0.3)}<br>Used: ${Object.keys(usage).length}/${apps.length}`;
document.getElementById("eTop").innerHTML=Object.entries(usage).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #222"><span>${e[0]}</span><span style="color:#0f0">${e[1]} min</span></div>`).join("")||"No use";
document.getElementById("hList").innerHTML=wds.length?wds.map(w=>`<div style="background:#000;padding:8px;border-radius:8px;margin:6px 0;border-left:3px solid ${w.status=='Paid'?'#0f0':'#ffcc00'}"><div style="display:flex;justify-content:space-between"><b style="color:#0f0">₹${w.amt}</b><small>${w.status||'Pending'}</small></div><small>UPI: ${w.upi} | ${w.date}</small></div>`).join(""):"No Withdrawal";
document.getElementById("aStats").innerHTML=`Total: ₹${total} | MD: ₹${Math.floor(total*0.3)} | Users: ₹${Math.floor(total*0.7)}<br>Apps: ${apps.length}`;
document.getElementById("wList").innerHTML=wds.length?wds.map((w,i)=>`<div style="background:#000;padding:6px;margin:4px 0;border-radius:6px;font-size:11px;display:flex;justify-content:space-between"><span>₹${w.amt} -> ${w.upi}<br><small>${w.date}</small></span><button onclick="markPaid(${i})" style="background:#0f0;color:#000;border:none;padding:4px 8px;border-radius:6px">Paid</button></div>`).join(""):"No Withdraw";
}
function openSpin(){
let modal=document.getElementById("gameModal"); modal.style.display="flex";
document.getElementById("modalContent").innerHTML=`<h2 style="color:#ffcc00">🎡 SPIN & WIN</h2><div class="wheel" id="wheel"></div><div id="spinResult" style="font-size:22px;font-weight:bold;color:#0f0;margin:10px">SPIN KARO!</div><button class="mainbtn" id="spinBtn" onclick="doSpin()">SPIN NOW</button><button onclick="closeModal()" style="background:none;border:none;color:#aaa;margin-top:10px">Close</button>`;
}
function doSpin(){
let btn=document.getElementById("spinBtn"); btn.disabled=true; btn.innerText="Spinning...";
let wheel=document.getElementById("wheel"); let deg=Math.floor(Math.random()*360)+1440; wheel.style.transform=`rotate(${deg}deg)`;
setTimeout(()=>{
let rewards=[10,20,30,50,100,5,15,25]; let win=rewards[Math.floor(Math.random()*rewards.length)];
document.getElementById("spinResult").innerText=`🎉 YOU WON ₹${win}!`;
bal+=win; total+=win; coins+=win; taskEarn+=win; update();
btn.innerText=`₹${win} COLLECTED!`; setTimeout(closeModal,1500);
},3000);
}
function openScratch(){
let modal=document.getElementById("gameModal"); modal.style.display="flex";
let win=Math.floor(Math.random()*45)+5;
document.getElementById("modalContent").innerHTML=`<h2 style="color:#ffcc00">🎟️ SCRATCH CARD</h2><div class="scratchArea" onclick="doScratch(${win})"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#0f0;font-weight:900">₹${win}</div><div class="scratchCover" id="cover">👆 TAP TO SCRATCH<br><small>Scratch Karo</small></div></div><div id="scratchResult" style="color:#aaa">Tap karo!</div><button onclick="closeModal()" style="background:none;border:none;color:#aaa;margin-top:10px">Close</button>`;
}
function doScratch(win){
document.getElementById("cover").style.display="none";
document.getElementById("scratchResult").innerHTML=`<b style="color:#0f0;font-size:20px">🎉 ₹${win} WON!</b>`;
bal+=win; total+=win; coins+=win; taskEarn+=win; update();
setTimeout(closeModal,1500);
}
function openAd(){
let modal=document.getElementById("gameModal"); modal.style.display="flex";
let sec=5;
document.getElementById("modalContent").innerHTML=`<h2 style="color:#0f0">📺 WATCH AD</h2><div class="adBox"><div style="font-size:40px">▶️</div><b>Ad Playing...</b><div id="adTimer" style="font-size:30px;color:#ffcc00;margin:10px">${sec}s</div><small>Ad pura dekho, ₹5 milega</small></div><button id="adBtn" disabled style="width:100%;background:#333;color:#aaa;border:none;padding:12px;border-radius:10px;margin-top:10px">Wait ${sec}s</button><button onclick="closeModal()" style="background:none;border:none;color:#aaa;margin-top:8px">Skip</button>`;
let t=setInterval(()=>{
sec--; let el=document.getElementById("adTimer"); if(el) el.innerText=sec+"s"; let b=document.getElementById("adBtn"); if(b) b.innerText=`Wait ${sec}s`;
if(sec<=0){clearInterval(t); let b2=document.getElementById("adBtn"); b2.disabled=false; b2.style.background="#0f0"; b2.style.color="#000"; b2.innerText="✅ COLLECT ₹5"; b2.onclick=function(){bal+=5; total+=5; coins+=5; taskEarn+=5; update(); closeModal(); alert("₹5 Ad Reward Added!");} }
},1000);
}
function closeModal(){document.getElementById("gameModal").style.display="none";}
function goPage(p){document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));document.querySelectorAll(".bottom button").forEach(e=>e.classList.remove("active"));if(p=='home'){document.getElementById("homePage").classList.add("active"); document.getElementById("bHome").classList.add("active");}if(p=='earn'){document.getElementById("earnPage").classList.add("active"); document.getElementById("bEarn").classList.add("active");}if(p=='history'){document.getElementById("historyPage").classList.add("active"); document.getElementById("bHist").classList.add("active");}if(p=='admin'){document.getElementById("adminPage").classList.add("active");}}
function withdraw(){let upi=document.getElementById("upi").value; let amt=parseInt(document.getElementById("amt").value); if(!upi||amt<100)return alert("Min 100"); if(amt>bal)return alert("Balance: ₹"+bal); wds.unshift({upi,amt,code,date:new Date().toLocaleString(),status:"Pending"}); bal-=amt; update(); window.open(`https://wa.me/${OWNER}?text=Withdraw%20${code}%20₹${amt}%20${upi}`,"_blank"); goPage('history');}
function markPaid(i){wds[i].status="Paid"; update();}
function openAdmin(){let p=prompt("Password:"); if(p=="VINU2025"){goPage('admin');}}
renderTabs(); renderApps(); update();
</script>
</body>
</html>
