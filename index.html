<!DOCTYPE html>
<html>
<head>
<title>VINU JS ROYAL KING - 9 LEVEL EARNING</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="text/javascript">
// Aapka Adsterra Social Bar - Yahi Real Earning dega
</script>
<script src="https://p1226000.profitablecpmgate.com/xxxx/invoke.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:sans-serif;text-align:center}
.app_card{background:#1e1e1e;padding:12px;margin:8px;border-radius:10px;border:1px solid #333}
button{background:gold;color:#000;padding:8px 15px;border:none;border-radius:8px;font-weight:bold}
#balance{color:gold;font-size:22px}
</style>
</head>
<body>
<h2>👑 VINU JS ROYAL KING - REAL</h2>
<div>Balance: Rs.<span id="balance">0</span> | Backend: <span id="backend">Checking...</span></div>
<div id="apps"></div>

<script>
// ===== CONFIG - Aapka wala hi hai =====
const BACKEND = "https://vinu-js-backend.onrender.com";
const SMARTLINK = "https://www.highperformancecpmgate.com/xxxx";
const USER_ID = localStorage.getItem("vinu_id") || "VINU_"+Date.now();
localStorage.setItem("vinu_id", USER_ID);
const ADMIN_ID = "31092163";

// Backend Check
fetch(BACKEND+'/api/health').then(r=>r.json()).then(d=>{
  document.getElementById('backend').innerText="Online ✅"
}).catch(e=>{
  document.getElementById('backend').innerText="Sleeping... 30sec wait"
});

// ===== 300 Apps Load =====
const appsDiv = document.getElementById('apps');
for(let i=1;i<=300;i++){
  appsDiv.innerHTML += `<div class="app_card">App ${i} - 2 Rs <button onclick="realEarn(${i})">Open & Earn</button></div>`;
}

// ===== 9 TARAH KI EARNING KA LOGIC - LEVEL BY LEVEL =====
async function realEarn(appId){
  // LEVEL 1 - Self Earning (Ad Open)
  window.open(SMARTLINK, "_blank");

  // LEVEL 2 to 9 - Backend ko bolo verify kare
  try{
    const res = await fetch(BACKEND+'/api/reward', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        userId: USER_ID,
        appId: appId,
        taskType: 'app_open',
        adProvider: 'adsterra',
        adminId: ADMIN_ID,
        // 9 Earning Types yahi se track hogi
        earningTypes: {
          self: 2, direct: 20, level: 5, task: 10,
          spin: 5, team: 100, rank: 500, adBonus: 50, royalty: 5
        }
      })
    });
    const data = await res.json();
    if(data.success){
      document.getElementById('balance').innerText=data.newBalance;
      alert('✅ Rs.2 Added! Total 9 Earning me add ho gaya');
    } else {
      alert('⚠️ '+data.error+' - 1 app 1 din me 1 baar');
    }
  }catch(e){
    alert('Backend abhi so raha hai, 30 sec me fir try karo');
  }
}

// Wallet History
async function loadWallet(){
  try{
    const r = await fetch(BACKEND+'/api/wallet/'+USER_ID);
    const d = await r.json();
    if(d.balance) document.getElementById('balance').innerText=d.balance;
  }catch(e){}
}
loadWallet();
</script>
</body>
</html>
