<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VINU Pay Real</title>
<script src="https://pl31192663.profitableratecpm.com/0b/1c/c6/0b1cc6c3e8b9a5a0e0e0e0e0e0e0e0e0.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
.top{background:#5e21a3;color:#fff;padding:16px;text-align:center;font-weight:bold;font-size:18px}
.header{background:#5e21a3;color:#fff;padding:20px 20px 30px 20px;border-radius:0 0 24px 24px}
.card-white{background:#fff;color:#000;padding:14px;border-radius:14px;display:flex;justify-content:space-between;margin-top:15px}
.card-white b{font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}
.item{background:#fff;padding:20px;border-radius:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.item b{font-size:17px}
.btn{width:100%;padding:12px;background:#5e21a3;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:12px;font-size:15px;cursor:pointer}
.withdraw{background:#fff;margin:14px;padding:18px;border-radius:16px}
input{width:92%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-bottom:12px;font-size:15px}
</style>
</head>
<body>
<div class="top">VINU PAY - REAL EARNING LIVE</div>
<div class="header">
  <div style="opacity:0.9">Available Balance</div>
  <h1 style="margin:10px 0 15px 0;font-size:42px" id="b1">₹45.00</h1>
  <div class="card-white">
    <div>VINU WALLET<br><b id="b2">₹45.00</b></div>
    <div style="text-align:right">Total Earned<br><b>₹500.00</b></div>
  </div>
</div>

<div class="grid">
  <div class="item"><b>Daily Check-in</b><br>₹5<br><button class="btn" onclick="earn(5)">Earn</button></div>
  <div class="item"><b>Watch Ad</b><br>₹2<br><button class="btn" onclick="earn(2)">Earn</button></div>
  <div class="item"><b>Play Game</b><br>₹10<br><button class="btn" onclick="earn(10)">Earn</button></div>
  <div class="item"><b>Refer & Earn</b><br>₹50<br><button class="btn" onclick="earn(50)">Earn</button></div>
</div>

<div class="withdraw">
  <h3 style="margin-top:0">Withdraw via UPI</h3>
  <input id="upi" placeholder="UPI ID likho">
  <input id="amt" placeholder="Amount" type="number">
  <button class="btn" onclick="withdraw()">Withdraw Now</button>
  <p id="msg" style="text-align:center;color:green"></p>
</div>

<script>
let bal = 45;
function earn(a){
  bal += a;
  document.getElementById('b1').innerText = '₹'+bal+'.00';
  document.getElementById('b2').innerText = '₹'+bal+'.00';
  alert('₹'+a+' Added!');
}
function withdraw(){
  let u=document.getElementById('upi').value;
  let amt=document.getElementById('amt').value;
  if(!u || !amt){document.getElementById('msg').innerText='UPI & Amount bharo';return;}
  document.getElementById('msg').innerText='Withdraw Request ₹'+amt+' to '+u+' Sent!';
}
</script>
</body>
</html>
