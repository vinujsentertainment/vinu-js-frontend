var filter='all';
async function loadWallet(){
 try{var r=await fetch(BACKEND+"/api/wallet/"+userId); var d=await r.json(); document.getElementById('bal').innerText=d.balance; document.getElementById('total').innerText="₹"+d.balance;}catch(e){}

function render(){
 var list=appsList;
 if(filter==='high') list=list.filter(function(a){return a.reward>=20});
 if(filter==='new') list=list.slice(0,50);
 if(filter==='claimed') list=list.filter(function(a){return claimed.includes(a.id)});
 var h="";
 list.forEach(function(a){
  var done=claimed.includes(a.id);
  h+='<div class="card"><div style="display:flex;align-items:center;gap:10px;flex:1"><div class="icon">'+a.icon+'</div><div><h4 style="font-size:13px">'+a.name+'</h4><p style="font-size:11px;color:#666">'+a.rating+' • Real • Earn ₹'+a.reward+'</p></div></div><button class="btn" id="b-'+a.id+'" onclick="start('+a.id+')" '+(done?'disabled':'')+'>'+(done?'Claimed ✅':'Earn ₹'+a.reward)+'</button></div>';

function filterApps(t,el){filter=t; document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')}); el.classList.add('active'); render();}
function start(id){
 var app=appsList.find(function(x){return x.id==id}); window.open(app.link,'_blank');
 var btn=document.getElementById('b-'+id); btn.disabled=true; var s=30;
 var tm=setInterval(function(){btn.innerText='Wait '+s+'s'; s--; if(s<0){clearInterval(tm); btn.innerText='Verify ₹'+app.reward; btn.disabled=false; btn.onclick=function(){verify(id)};}},1000);
}
async function verify(id){
 var app=appsList.find(function(x){return x.id==id}); if(!app) app={reward:2, id:id};
 var btn=document.getElementById('b-'+id); if(btn){btn.disabled=true; btn.innerText="Verifying...";}
 try{
  var r=await fetch(BACKEND+"/api/tasks/verify-ad",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:userId, appId:id, adWatched:true, reward:app.reward})});

 }catch(e){alert("Try again after 30 sec")}
}
