<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINOD AVJS ROYAL KING</title><script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0a0a;color:#fff;font-family:system-ui}.page{display:none}.page.active{display:block}.botnav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222;z-index:99}.nav{color:#666;font-size:11px;font-weight:700;text-align:center;cursor:pointer}.nav.active{color:#FFD700}.story-card{background:#1a1a1a;border-radius:16px;overflow:hidden;border:1px solid #222}.coins{background:#FFD700;color:#000;padding:3px 10px;border-radius:20px;font-weight:900;font-size:12px}</style></head><body>
<div style="position:sticky;top:0;z-index:50;background:#000;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222"><div><div style="font-weight:900;color:#FFD700;font-size:16px">👑 VINOD AVJS ROYAL KING</div><div style="font-size:9px;color:#666">MD: VINOD BAIDORIYA</div></div><div style="display:flex;gap:8px"><span class="coins">💎 <span id="coins">100</span></span><span style="background:#222;padding:5px 12px;border-radius:20px;font-weight:800">₹<span id="bal">0</span></span></div></div>

<div id="p-home" class="page active" style="padding:12px">
<input id="search" placeholder="🔍 Search stories, audio, shorts..." style="width:100%;background:#1a1a1a;border:1px solid #222;padding:12px;border-radius:12px;margin-bottom:12px" oninput="searchStories()">
<div style="background:linear-gradient(135deg,#FFD700,#FF8C00);color:#000;padding:16px;border-radius:20px"><div style="font-size:10px;font-weight:900">ID: <span id="uid"></span></div><h2 style="font-weight:900;font-size:18px;margin-top:4px">🎧 Trending Today</h2><button onclick="initAd()" style="background:#000;color:#FFD700;padding:8px 14px;border-radius:20px;margin-top:10px;font-weight:800;font-size:12px">🎥 Watch Ad = 20 Coins</button><div id="adS" style="font-size:10px;margin-top:6px;font-weight:700">Ad Status: Ready</div></div>
<h3 style="margin:14px 0 8px;font-weight:800">🔥 Trending</h3><div id="trending" style="display:flex;gap:10px;overflow-x:auto"></div>
<h3 style="margin:14px 0 8px;font-weight:800">📖 All Stories</h3><div id="allStories" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
</div>

<div id="p-audio" class="page" style="padding:12px"><h2 style="font-weight:900">🎧 Audio Stories</h2><div id="audioList" style="margin-top:10px"></div></div>
<div id="p-shorts" class="page" style="padding:12px"><h2 style="font-weight:900">📺 Shorts / Reels</h2><div id="shortsList" style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"></div></div>
<div id="p-wallet" class="page" style="padding:12px"><div style="background:#1a1a1a;padding:20px;border-radius:20px;text-align:center;border:1px solid #222"><h1 style="font-size:36px;font-weight:900;color:#FFD700">₹<span id="bal2">0</span></h1><div style="margin-top:6px"><span class="coins">💎 <span id="coins2">0</span> Coins</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px"><div onclick="earn('daily')" style="background:#222;padding:12px;border-radius:12px;text-align:center">🎁 Daily<br><b>₹2 + 10💎</b></div><div onclick="earn('spin')" style="background:#222;padding:12px;border-radius:12px;text-align:center">🎡 Spin<br><b>₹5 + 25💎</b></div></div><input id="upi" placeholder="UPI ID" style="width:100%;background:#000;border:1px solid #333;padding:12px;border-radius:12px;margin-top:14px"><button onclick="wd()" style="width:100%;background:#FFD700;color:#000;padding:12px;border-radius:12px;margin-top:8px;font-weight:900">Withdraw ₹100</button></div><div id="hist" style="margin-top:12px;background:#1a1a1a;padding:12px;border-radius:16px;font-size:12px"></div></div>
<div id="p-profile" class="page" style="padding:12px"><div style="background:#1a1a1a;padding:20px;border-radius:20px;text-align:center"><div style="width:60px;height:60px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;margin:0 auto">👑</div><h2 style="font-weight:900;margin-top:10px;color:#FFD700">VINOD BAIDORIYA</h2><div style="font-size:11px;color:#888">MD - ROYAL KING</div><div style="font-size:11px;margin-top:8px">ID: <b id="uid2"></b> | Ref: <b id="ref" style="color:#FFD700"></b></div><input id="refIn" placeholder="Refer Code" style="width:100%;background:#000;border:1px solid #333;padding:10px;border-radius:12px;margin-top:12px"><button onclick="applyRef()" style="width:100%;background:#222;padding:10px;border-radius:12px;margin-top:6px">Apply Referral</button></div></div>

<div style="height:70px"></div>
<div class="botnav"><div class="nav active" id="n-home" onclick="openP('home')">🎬<br>Home</div><div class="nav" id="n-audio" onclick="openP('audio')">🎧<br>Audio</div><div class="nav" id="n-shorts" onclick="openP('shorts')">📺<br>Shorts</div><div class="nav" id="n-wallet" onclick="openP('wallet')">💎<br>Wallet</div><div class="nav" id="n-profile" onclick="openP('profile')">👤<br>Profile</div></div>

<script>
const BACKEND="https://js-backend.onrender.com";
let uid=localStorage.getItem('rk')||'RK_'+Math.random().toString(36).slice(2,9).toUpperCase(); localStorage.setItem('rk',uid);
let allData=[]; let slot=null;

function openP(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active')); document.getElementById('p-'+p).classList.add('active'); document.querySelectorAll('.nav').forEach(e=>e.classList.remove('active')); document.getElementById('n-'+p).classList.add('active'); if(p=='wallet') load();}

function initAd(){document.getElementById('adS').innerText='Loading...'; googletag.cmd.push(()=>{slot=googletag.defineOutOfPageSlot('/22639388115/rewarded',googletag.enums.OutOfPageFormat.REWARDED).addService(googletag.pubads()); googletag.pubads().addEventListener('rewardedSlotReady',e=>{document.getElementById('adS').innerText='✅ Ad Ready'; e.makeRewardedVisible();}); googletag.pubads().addEventListener('rewardedSlotGranted',()=>{document.getElementById('adS').innerText='✅ 20 Coins + ₹2 SSV Sent'; setTimeout(load,4000);}); googletag.pubads().setCustomData(uid); googletag.enableServices(); googletag.display(slot);});}

async function fetchStories(){ try{let r=await fetch(BACKEND+'/api/stories'); allData=await r.json(); }catch{ allData=[{id:'s1',title:'Royal King Ki Kahani',type:'audio',category:'Motivation',duration:'12:05',thumb:'👑',coins:5,trending:true},{id:'s4',title:'Shorts - Motivation',type:'short',category:'Shorts',duration:'0:45',thumb:'🔥',coins:2,trending:true}]; } render(allData); }

function render(list){
  document.getElementById('trending').innerHTML=list.filter(s=>s.trending).map(s=>`<div class="story-card" style="min-width:140px;padding:12px" onclick="playStory('${s.id}')"><div style="font-size:28px">${s.thumb}</div><div style="font-size:12px;font-weight:700;margin-top:6px">${s.title}</div><div style="font-size:10px;color:#888">${s.duration} • ${s.coins}💎</div></div>`).join('');
  document.getElementById('allStories').innerHTML=list.map(s=>`<div class="story-card" style="padding:12px" onclick="playStory('${s.id}')"><div style="font-size:24px">${s.thumb}</div><div style="font-weight:700;font-size:13px;margin-top:4px">${s.title}</div><div style="font-size:10px;color:#888">${s.category} • ${s.type}</div><div style="margin-top:6px"><span style="background:#222;padding:2px 8px;border-radius:10px;font-size:10px">💎 ${s.coins}</span></div></div>`).join('');
  document.getElementById('audioList').innerHTML=list.filter(s=>s.type=='audio').map(s=>`<div style="background:#1a1a1a;padding:12px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between" onclick="playStory('${s.id}')"><div><b>${s.title}</b><div style="font-size:11px;color:#888">${s.duration}</div></div><div class="coins">${s.coins}💎</div></div>`).join('');
  document.getElementById('shortsList').innerHTML=list.filter(s=>s.type=='short').map(s=>`<div class="story-card" style="padding:20px;text-align:center" onclick="playStory('${s.id}')"><div style="font-size:30px">${s.thumb}</div><div style="font-size:11px;margin-top:6px">${s.title}</div></div>`).join('');
}

function playStory(id){ let s=allData.find(x=>x.id==id); if(s.coins>0){ if(confirm(`${s.title} - Unlock with ${s.coins} coins?`)){ watchAdForStory(s); } } else { alert('Playing: '+s.title+' (Yahan tumhara original player lagega)'); } }
function watchAdForStory(s){ if(!slot) initAd(); setTimeout(()=>{ googletag.cmd.push(()=>googletag.display(slot)); },500); }

function searchStories(){ let q=document.getElementById('search').value.toLowerCase(); render(allData.filter(s=>s.title.toLowerCase().includes(q) || s.category.toLowerCase().includes(q))); }

async function earn(t){ try{let r=await fetch(BACKEND+'/api/earn/'+t,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid})}); let d=await r.json(); alert(d.success?`+₹${d.reward} + ${d.coins} coins`:'⚠️ '+d.message); load();}catch{alert('Backend waking...');}}
async function load(){ document.getElementById('uid').innerText=uid; document.getElementById('uid2').innerText=uid; try{let r=await fetch(BACKEND+'/api/wallet/'+uid); let d=await r.json(); document.getElementById('bal').innerText=(d.balance||0); document.getElementById('bal2').innerText=(d.balance||0); document.getElementById('coins').innerText=d.coins||0; document.getElementById('coins2').innerText=d.coins||0; document.getElementById('ref').innerText=d.referral_code||'';}catch{} try{let r=await fetch(BACKEND+'/api/history/'+uid); let d=await r.json(); document.getElementById('hist').innerHTML=(d.transactions||[]).map(x=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222"><span>${x.description}</span><b style="color:${x.amount>0?'#0f0':'#f00'}">+${x.coins||0}💎 ₹${x.amount}</b></div>`).join('');}catch{}}
function wd(){ let u=document.getElementById('upi').value; if(!u) return alert('UPI daalo'); fetch(BACKEND+'/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,amount:100,upiId:u})}).then(r=>r.json()).then(d=>alert(d.message));}
function applyRef(){ let c=document.getElementById('refIn').value; fetch(BACKEND+'/api/referral/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,referralCode:c})}).then(r=>r.json()).then(d=>alert(d.message));}

fetchStories(); load();
</script></body></html>
