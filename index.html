<script>
const APP_DATA=[]; const cats=[["Social",82],["Games",75],["Shopping",60],["Finance",45],["Video",48]]; const pkgs=[["WhatsApp","com.whatsapp"],["Instagram","com.instagram.android"],["Facebook","com.facebook.katana"],["PhonePe","com.phonepe.app"],["Paytm","net.one97.paytm"],["Amazon","com.amazon.mShop.android.shopping"],["Flipkart","com.flipkart.android"],["Dream11","com.dream11.fantasy_cricket.league"],["Ludo King","com.ludo.king"],["MX Player","com.mxtech.videoplayer.ad"]];
let id=1; cats.forEach(([catName,count])=>{ for(let i=0;i<count;i++){ if(APP_DATA.length>=310) break; let p=pkgs[(id+3)%pkgs.length]; APP_DATA.push({id:id,name:p[0]+(id>10?" "+id:""),c:catName,pkg:p[1],reward:id%5==0?10:2,icon:"https://play-lh.googleusercontent.com/VRMWkE5p3CkWhJs6nv-9ZsLAsJBUOg_g4_20jUOqCaFEj1sF80lMgyiiWvFJJJgE"}); id++; } });
const userId=localStorage.getItem('earn_user')||'USER_'+Math.floor(Math.random()*900000+100000); localStorage.setItem('earn_user',userId);
function openPage(p){ document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active')); document.getElementById('page-'+p).classList.add('active'); document.getElementById('t-'+p).classList.add('active'); if(p==='earn') renderApps(curCat); updateBal(); }
let curCat='All';
document.getElementById('catGrid').innerHTML=cats.map(([n,c])=>`<div class="cat" onclick="curCat='${n}';openPage('earn')"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670124.png" width="30"><p>${n}<br><span>${c} Apps</span></p></div>`).join('')+`<div class="cat" onclick="curCat='All';openPage('earn')"><p>All Apps<br><span>310 Apps</span></p></div>`;
document.getElementById('filters').innerHTML=['All',...cats.map(x=>x[0])].map(c=>`<button onclick="curCat='${c}';renderApps('${c}')" style="background:#1c1c1c;border:1px solid #333;color:#fff;padding:6px 12px;border-radius:20px">${c}</button>`).join('');
function renderApps(cat){ let f=cat==='All'?APP_DATA:APP_DATA.filter(a=>a.c===cat); document.getElementById('appList').innerHTML=f.map((a,i)=>`${i%6===0&&i!==0?'<div class="ad-box">AdMoney Ad <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"></ins></div>':''}<div class="app"><img src="${a.icon}"><div style="flex:1"><b>${a.name}</b><br><small>${a.c} • ₹${a.reward}</small></div><button onclick="claimApp(${a.id},'${a.pkg}')">₹${a.reward}</button></div>`).join(''); }
async function updateBal(){ try{ const r=await fetch('/api/wallet/'+userId); const d=await r.json(); document.getElementById('balHead').innerText='₹'+d.balance; document.getElementById('bigBal').innerText='₹'+d.balance; }catch(e){} }
async function claimApp(appId,pkg){
 window.open('https://play.google.com/store/apps/details?id='+pkg,'_blank');
 if(!confirm('App Install Kiya? Ad Dekhne Ke Baad Reward Milega. OK Daba Ke Ad Dekho')) return;
 // Yaha AdMob Rewarded Ad Trigger Hoga
 try{ const res=await fetch('/api/tasks/verify-ad',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,appId,adWatched:true})}); const data=await res.json(); alert(data.success?`₹${data.reward} Added! Balance ₹${data.newBalance}`:data.message); updateBal(); }catch(e){ alert(e.message); }
}
async function doWithdraw(){ const upi=document.getElementById('upi').value; const amt=parseInt(document.getElementById('amt').value); if(!upi.includes('@')) return alert('Sahi UPI dalo'); const res=await fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,upiId:upi,amount:amt})}); const d=await res.json(); document.getElementById('wMsg').innerText=d.message||d.error; updateBal(); }
async function loadAdmin(){ const key=document.getElementById('adminKey').value; const r=await fetch('/api/admin/withdrawals?key='+key); const data=await r.json(); if(data.error) return alert(data.error); document.getElementById('adminBody').innerHTML=data.map(x=>`<tr><td>${x.id}</td><td>${x.user_id.slice(0,7)}</td><td>₹${x.amount}</td><td>${x.upi_id}</td><td>${x.status}</td><td><button onclick="updateStatus(${x.id},'paid')">Paid</button></td></tr>`).join(''); }
async function updateStatus(id,status){ const key=document.getElementById('adminKey').value; await fetch('/api/admin/update-status?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})}); loadAdmin(); }
updateBal(); renderApps('All');
