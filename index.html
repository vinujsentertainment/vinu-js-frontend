<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinu JS Earning</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:15px}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.btn{background:#ff6a00;color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:bold;width:100%}
.btn:disabled{background:#aaa}
</style>
</head>
<body>
<h2>💰 Wallet: ₹<span id="balance">0</span></h2>
<div id="apps"></div>

<script>
const BACKEND = "https://vinu-js-backend.onrender.com";
const userId = localStorage.getItem('vinu_user') || 'user_' + Math.random().toString(36).substr(2,9);
localStorage.setItem('vinu_user', userId);

const appsList = [
 {id:1, name:"Task App 1", link:"https://google.com"},
 {id:2, name:"Task App 2", link:"https://google.com"},
 {id:3, name:"Task App 3", link:"https://google.com"}
];

async function loadWallet(){
 let r = await fetch(`${BACKEND}/api/wallet/${userId}`);
 let d = await r.json();
 document.getElementById('balance').innerText = d.balance;
}

function renderApps(){
 let html="";
 appsList.forEach(app=>{
  html+=`<div class="card"><h3>${app.name}</h3><p>Install & Earn ₹2</p><button class="btn" id="btn-${app.id}" onclick="handleEarn(${app.id})">Earn ₹2</button></div>`;
 });
 document.getElementById('apps').innerHTML=html;
}

function handleEarn(appId){
 let app = appsList.find(a=>a.id==appId);
 window.open(app.link, '_blank');
 let btn = document.getElementById(`btn-${appId}`);
 btn.disabled=true;
 let sec=30;
 let timer=setInterval(()=>{
  btn.innerText=`Wait ${sec}s...`;
  sec--;
  if(sec<0){
   clearInterval(timer);
   btn.innerText="Verify & Get ₹2";
   btn.disabled=false;
   btn.onclick=()=>verifyEarn(appId);
  }
 },1000);
}

async function verifyEarn(appId){
 let btn=document.getElementById(`btn-${appId}`);
 btn.disabled=true; btn.innerText="Verifying...";
 let res=await fetch(`${BACKEND}/api/tasks/verify-ad`,{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({userId, appId, adWatched:true})
 });
 let data=await res.json();
 if(data.success){
  alert("₹2 Added!");
  loadWallet();
  btn.innerText="Claimed ✅";
 } else {
  alert(data.message);
  btn.innerText=data.message;
 }
}

loadWallet();
renderApps();
</script>
</body>
</html>
