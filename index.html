<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINOD AVJS ROYAL KING</title><script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script><script src="https://cdn.tailwindcss.com"></script><style>body{background:#000;color:#fff;font-family:system-ui}.page{display:none}.page.active{display:block}.botnav{position:fixed;bottom:0;left:0;right:0;background:#151515;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222;z-index:99}.nav{color:#777;font-size:12px;font-weight:700;cursor:pointer;padding:6px 12px;border-radius:20px}.nav.active{background:#FFD700;color:#000}.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}</style></head><body>
<div style="padding:12px;background:#000;border-bottom:1px solid #333;display:flex;justify-content:space-between;position:sticky;top:0;z-index:50"><b style="color:#FFD700">VINOD AVJS ROYAL KING 👑</b><span style="background:#FFD700;color:#000;padding:4px 12px;border-radius:20px;font-weight:900">₹<span id="bal">0.00</span></span></div>

<div id="p-home" class="page active" style="padding:12px"><div style="background:#FFD700;color:#000;padding:16px;border-radius:20px"><div style="font-size:10px;font-weight:900">ID: <span id="uid"></span> | REF: <span id="ref"></span></div><h2 style="font-weight:900;font-size:20px;margin-top:6px">REAL EARNING - ADMOB SSV</h2><button onclick="initAd()" style="background:#000;color:#FFD700;padding:8px 16px;border-radius:20px;margin-top:10px;font-weight:800">Load Ad</button><div id="adS" style="font-size:11px;margin-top:8px;font-weight:700">Ad Status: Not Loaded</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px"><div onclick="earn('daily')" style="background:#1c1c1c;padding:14px;border-radius:14px;text-align:center;font-weight:700">📅 Daily ₹2</div><div onclick="earn('spin')" style="background:#1c1c1c;padding:14px;border-radius:14px;text-align:center;font-weight:700">🎡 Spin ₹5</div><div onclick="watchAd()" style="background:#1c1c1c;padding:14px;border-radius:14px;text-align:center;font-weight:700">🎥 Ad ₹2</div></div></div>

<div id="p-apps" class="page" style="padding:12px"><div id="list"></div></div>
<div id="p-wallet" class="page" style="padding:12px"><div style="background:#1c1c1c;padding:20px;border-radius:20px;text-align:center"><h1 style="font-size:36px;font-weight:900;color:#FFD700">₹<span id="bal2">0.00</span></h1><div style="color:#888;font-size:12px">Total: ₹<span id="tot">0</span></div><input id="upi" placeholder="UPI ID: vinod@ybl" style="width:100%;background:#000;border:1px solid #333;padding:12px;border-radius:12px;margin-top:14px"><button onclick="wd()" style="width:100%;background:#FFD700;color:#000;padding:12px;border-radius:12px;margin-top:10px;font-weight:900">Withdraw ₹100</button></div></div>
<div id="p-history" class="page" style="padding:12px"><div id="hist" style="background:#1c1c1c;padding:14px;border-radius:16px;font-size:12px"></div></div>
<div id="p-profile" class="page" style="padding:12px"><div style="background:#1c1c1c;padding:20px;border-radius:20px;text-align:center"><h2 style="color:#FFD700;font-weight:900">VINOD BAIDORIYA - MD</h2><div id="uid2" style="font-size:12px;margin-top:6px"></div><div id="ref2" style="font-size:12px;color:#FFD700;font-weight:800"></div><input id="refIn" placeholder="Refer Code" style="width:100%;background:#000;border:1px solid #333;padding:10px;border-radius:12px;margin-top:12px"><button onclick="applyRef()" style="width:100%;background:#333;padding:10px;border-radius:12px;margin-top:8px">Apply</button></div></div>

<div style="height:70px"></div><div class="botnav"><div class="nav active" id="n-home" onclick="openP('home')">Home</div><div class="nav" id="n-apps" onclick="openP('apps')">Tasks</div><div class="nav" id="n-wallet" onclick="openP('wallet')">Wallet</div><div class="nav" id="n-history" onclick="openP('history')">History</div><div class="nav" id="n-profile" onclick="openP('profile')">Profile</div></div>
<script>
const BACKEND="https://js-backend.onrender.com";
let uid=localStorage.getItem('rk')||'RK_'+Math.random().toString(36).slice(2,9).toUpperCase(); localStorage.setItem('rk',uid);
let slot=null;
function openP(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active')); document.getElementById('p-'+p).classList.add('active'); document.querySelectorAll('.nav').forEach(e=>e.classList.remove('active')); document.getElementById('n-'+p).classList.add('active'); if(p!='apps') load();}
function initAd(){document.getElementById('adS').innerText='Loading Google Ad...'; googletag.cmd.push(()=>{slot=googletag.defineOutOfPageSlot('/22639388115/rewarded',googletag.enums.OutOfPageFormat.REWARDED).addService(googletag.pubads()); googletag.pubads().addEventListener('rewardedSlotReady',e=>{document.getElementById('adS').innerText='✅ Ad Ready - Click'; e.makeRewardedVisible();}); googletag.pubads().addEventListener('rewardedSlotGranted',()=>{document.getElementById('adS').innerText='✅ SSV Sent - Wallet update hoga'; setTimeout(load,4000);}); googletag.pubads().setCustomData(uid); googletag.enableServices(); googletag.display(slot);});}
function watchAd(){ if(!slot) return initAd(); googletag.cmd.push(()=>googletag.display(slot));}
const APPS=[{n:"PhonePe",p:"com.phonepe.app"},{n:"Google Pay",p:"com.google.android.apps.nbu.paisa.user"},{n:"Paytm",p:"net.one97.paytm"},{n:"Flipkart",p:"com.flipkart.android"},{n:"Amazon",p:"com.amazon.mShop.android.shopping"},{n:"Meesho",p:"com.meesho.supply"}];
function render(){document.getElementById('list').innerHTML=APPS.map(a=>`<div class="card"><div style="display:flex;gap:10px;align-items:center"><img src="https://www.google.com/s2/favicons?domain=${a.p}.com&sz=128" style="width:36px;height:36px;background:#fff;border-radius:8px;padding:2px"><b>${a.n}</b></div><button onclick="watchAd()" style="background:#FFD700;color:#000;padding:8px 14px;border-radius:20px;font-weight:900;font-size:12px">Earn ₹10</button></div>`).join('');}
async function earn(t){try{let r=await fetch(BACKEND+'/api/earn/'+t,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid})}); let d=await r.json(); alert(d.success?'₹'+d.reward+' credited':'⚠️ '+d.message); load();}catch{alert('Backend sleep pe hai - 20 sec baad try karo');}}
async function load(){document.getElementById('uid').innerText=uid; document.getElementById('uid2').innerText=uid; try{let r=await fetch(BACKEND+'/api/wallet/'+uid); let d=await r.json(); document.getElementById('bal').innerText=(d.balance||0).toFixed(2); document.getElementById('bal2').innerText=(d.balance||0).toFixed(2); document.getElementById('tot').innerText=d.total_earned||0; document.getElementById('ref').innerText=d.referral_code||''; document.getElementById('ref2').innerText=d.referral_code||'';}catch{} try{let r=await fetch(BACKEND+'/api/history/'+uid); let d=await r.json(); document.getElementById('hist').innerHTML=d.transactions.map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222"><span>${x.description}</span><b style="color:${x.amount>0?'#0f0':'#f00'}">${x.amount>0?'+':''}₹${x.amount}</b></div>`).join('')||'No history';}catch{}}
function wd(){let u=document.getElementById('upi').value; if(!u) return alert('UPI daalo'); fetch(BACKEND+'/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,amount:100,upiId:u})}).then(r=>r.json()).then(d=>alert(d.message));}
function applyRef(){let c=document.getElementById('refIn').value; fetch(BACKEND+'/api/referral/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,referralCode:c})}).then(r=>r.json()).then(d=>alert(d.message));}
render(); load();
</script></body></html>
