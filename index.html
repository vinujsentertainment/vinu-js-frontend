<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINOD AVJS ENTERTAINMENT</title>
<link rel="icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f4f5fb;padding:10px;padding-bottom:90px}
.header{background:linear-gradient(135deg,#000,#FFD700);color:#fff;padding:12px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:10px;z-index:10}
.bal{font-size:24px;font-weight:900}.sec{background:#fff;border-radius:14px;padding:12px;margin:12px 0;border:1px solid #FFD700}
.grid9{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.box9{background:#fff;border:1px solid #eee;border-radius:12px;padding:8px;text-align:center}
.catbar{display:flex;gap:8px;overflow:auto;padding:8px 0;position:sticky;top:70px;background:#f4f5fb;z-index:9}.cat{background:#fff;border:1px solid #ddd;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}.cat.active{background:#000;color:#FFD700;border-color:#FFD700}
.card{background:#fff;border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border-left:3px solid #FFD700}.logo{width:44px;height:44px;border-radius:10px;border:1px solid #eee}
.btn{background:#000;color:#FFD700;border:1px solid #FFD700;padding:6px 12px;border-radius:20px;font-weight:800;font-size:11px}.btn:disabled{background:#ddd;color:#888}
</style></head><body>
<div class="header"><div style="display:flex;gap:10px;align-items:center"><img src="icon.png" style="width:40px;height:40px;border-radius:10px;border:1px solid #FFD700"><div><h1 style="font-size:14px;color:#FFD700">VINOD AVJS<br>ENTERTAINMENT</h1><p id="uid" style="font-size:8px"></p></div></div><div><p style="font-size:10px">Wallet</p><div class="bal">₹<span id="bal">0</span></div></div></div>
<div class="sec"><h3 style="font-size:13px">💰 9 Tarah Se Kamao</h3><div class="grid9">
<div class="box9" onclick="doEarn(5,'Spin')">🎡<br><b style="font-size:10px">Spin ₹5</b></div>
<div class="box9" onclick="doEarn(2,'Daily')">📅<br><b style="font-size:10px">Daily ₹2</b></div>
<div class="box9" onclick="doEarn(50,'Refer')">👥<br><b style="font-size:10px">Refer ₹50</b></div>
<div class="box9" onclick="doEarn(5,'Quiz')">❓<br><b style="font-size:10px">Quiz ₹5</b></div>
<div class="box9" onclick="doEarn(3,'Scratch')">🎟️<br><b style="font-size:10px">Scratch ₹3</b></div>
<div class="box9" onclick="doEarn(10,'Survey')">📝<br><b style="font-size:10px">Survey ₹10</b></div>
</div></div>
<div class="catbar"><div class="cat active" onclick="filterCat('all',this)">All 310</div><div class="cat" onclick="filterCat('UPI',this)">UPI</div><div class="cat" onclick="filterCat('Social',this)">Social</div><div class="cat" onclick="filterCat('Shopping',this)">Shopping</div><div class="cat" onclick="filterCat('Fantasy',this)">Fantasy</div><div class="cat" onclick="filterCat('Finance',this)">Finance</div><div class="cat" onclick="filterCat('Food',this)">Food</div><div class="cat" onclick="filterCat('Entertainment',this)">Entertainment</div></div>
<div id="apps"></div>
<script>
const BACKEND="https://vinu-js-backend.onrender.com";
const userId=localStorage.getItem('vinu_user')||'user_'+Math.random().toString(36).substr(2,6);
localStorage.setItem('vinu_user',userId);document.getElementById('uid').innerText=userId;
const base=["PhonePe|phonepe.com|50|UPI","Google Pay|pay.google.com|50|UPI","Paytm|paytm.com|50|UPI","CRED|cred.club|50|UPI","BHIM|bhimupi.org.in|20|UPI","WhatsApp|whatsapp.com|10|Social","Instagram|instagram.com|10|Social","Facebook|facebook.com|10|Social","Telegram|telegram.org|10|Social","YouTube|youtube.com|10|Social","Flipkart|flipkart.com|20|Shopping","Amazon|amazon.in|20|Shopping","Meesho|meesho.com|15|Shopping","Myntra|myntra.com|15|Shopping","Nykaa|nykaa.com|15|Shopping","Dream11|dream11.com|50|Fantasy","MPL|mpl.live|50|Fantasy","WinZO|winzo.com|50|Fantasy","Ludo King|ludoking.com|10|Fantasy","Free Fire|freefire.com|15|Fantasy","Upstox|upstox.com|50|Finance","Groww|groww.in|50|Finance","Zerodha|zerodha.com|50|Finance","CRED|cred.club|50|Finance","Slice|sliceit.com|15|Finance","Swiggy|swiggy.com|20|Food","Zomato|zomato.com|20|Food","Ola|olacabs.com|15|Food","IRCTC|irctc.co.in|15|Food","MakeMyTrip|makemytrip.com|20|Food","Hotstar|hotstar.com|10|Entertainment","Netflix|netflix.com|15|Entertainment","Spotify|spotify.com|10|Entertainment","Canva|canva.com|10|Entertainment","MX Player|mxplayer.in|5|Entertainment"];
let raw=[...base];
for(let i=base.length+1;i<=310;i++) raw.push(`Top App ${i}|google.com|3|More`);
const appsList=raw.map((s,i)=>{let p=s.split('|');return{id:i+1,name:p[0],domain:p[1],reward:+p[2],cat:p[3],icon:`https://logo.clearbit.com/${p[1]}`,link:`https://play.google.com/store/search?q=${p[0]}`} });
let claimed=JSON.parse(localStorage.getItem('claimed_ids')||'[]');let curCat='all';
async function loadWallet(){try{let r=await fetch(BACKEND+"/api/wallet/"+userId);let d=await r.json();document.getElementById('bal').innerText=d.balance}catch(e){}}
function render(){let list=curCat=='all'?appsList:appsList.filter(a=>a.cat==curCat);let h=`<p style="font-size:11px;margin-bottom:6px">${list.length} Apps • VINOD AVJS</p>`;list.forEach(a=>{let done=claimed.includes(a.id);h+=`<div class="card"><div style="display:flex;gap:10px;align-items:center"><img class="logo" src="${a.icon}" onerror="this.src='https://www.google.com/s2/favicons?domain='+a.domain"><div><h4 style="font-size:12px">${a.name} <span style="font-size:8px;background:#FFF8DC;border:1px solid #FFD700;padding:1px 4px;border-radius:4px">${a.cat}</span></h4><p style="font-size:10px;color:#666">Earn ₹${a.reward} • 4.8★</p></div></div><button class="btn" id="b-${a.id}" onclick="start(${a.id})" ${done?'disabled':''}>${done?'Claimed':'Earn ₹'+a.reward}</button></div>`});document.getElementById('apps').innerHTML=h}
function filterCat(c,el){curCat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function start(id){let app=appsList.find(x=>x.id==id);window.open(app.link,'_blank');let btn=document.getElementById('b-'+id);btn.disabled=true;let s=30;let tm=setInterval(()=>{btn.innerText='Wait '+s+'s';s--;if(s<0){clearInterval(tm);btn.innerText='Verify ₹'+app.reward;btn.disabled=false;btn.onclick=()=>verify(id)}},1000)}
async function verify(id){let app=appsList.find(x=>x.id==id);let btn=document.getElementById('b-'+id);btn.disabled=true;btn.innerText="Verifying...";try{let r=await fetch(BACKEND+"/api/tasks/verify-ad",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,appId:id,adWatched:true,reward:app.reward})});let d=await r.json();if(d.success){claimed.push(id);localStorage.setItem('claimed_ids',JSON.stringify(claimed));alert('✅ ₹'+app.reward+' Added!');document.getElementById('bal').innerText=d.newBalance;btn.innerText="Claimed ✅"}else{alert(d.message);btn.disabled=false;btn.innerText='Earn ₹'+app.reward}}catch(e){alert("Backend waking...");btn.disabled=false;btn.innerText="Retry"}}
async function doEarn(amt,type){let fakeId=1000+Math.floor(Math.random()*9000);try{let r=await fetch(BACKEND+"/api/tasks/verify-ad",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,appId:fakeId,adWatched:true,reward:amt})});let d=await r.json();if(d.success){alert('✅ ₹'+amt+' Added from '+type+'!');document.getElementById('bal').innerText=d.newBalance}else alert(d.message)}catch(e){alert("Try again")}}
loadWallet();render();
</script></body></html>
