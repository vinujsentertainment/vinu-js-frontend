<!-- Vercel frontend sirf UI, saara paisa ka logic Render backend -->
<script>
const BACKEND = "https://YOUR-RENDER-URL.onrender.com";
let userId = localStorage.getItem('rk_uid') || 'RK_'+Math.random().toString(36).slice(2,10).toUpperCase();
localStorage.setItem('rk_uid', userId);

// Wallet hamesha server se
async function loadWallet(){
  let r = await fetch(`${BACKEND}/api/wallet/${userId}`);
  let d = await r.json();
  document.getElementById('walletBal').innerText = `₹${(d.balance||0).toFixed(2)}`;
  // is_premium bhi server se, localStorage se nahi
  if(d.is_premium) document.body.classList.add('premium');
}

// Earn - amount frontend me nahi
async function doEarn(type){
  let res = await fetch(`${BACKEND}/api/earn/${type}`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({userId}) // sirf userId, amount nahi
  });
  let data = await res.json();
  alert(data.success?`+₹${data.reward}`:data.message);
  loadWallet();
}

// Task complete - ad verification ke baad hi
async function completeTask(appId, ssvTxId){
  let res = await fetch(`${BACKEND}/api/tasks/complete`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({userId, appId, ssv_transaction_id: ssvTxId})
  });
  // reward server decide karega
}

</script>
