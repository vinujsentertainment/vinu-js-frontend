<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinu JS - 9 Level Earning</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:15px}
.header{display:flex;justify-content:space-between;background:#1e293b;padding:12px;border-radius:10px}
.bal{color:#22c55e;font-weight:bold}
.card{background:#1e293b;margin:10px 0;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#22c55e;color:#000;border:0;padding:8px 15px;border-radius:8px;font-weight:bold}
.level-box{background:#1e293b;padding:10px;border-radius:10px;margin-top:15px}
.level-box b{color:#facc15}
.online{color:#22c55e} .offline{color:#ef4444}
</style>
</head>
<body>
<div class="header">
<div>Vinu JS Earning</div>
<div><span id="status" class="offline">Checking...</span> | <span class="bal" id="balance">Rs.0</span></div>
</div>

<div class="level-box">
<b>9 ID Earning Status:</b><br>
1. Self: Rs.2/app ✅<br>
2. Direct Refer: Rs.20 ✅<br>
3. Level Income (7 Level) ✅<br>
4. Daily Task (10 Apps=Rs.10) ✅<br>
5. Spin & Win ✅<br>
6. Team Bonus ✅<br>
7. Rank Bonus ✅<br>
8. Ad Bonus (100 Apps=Rs.50) ✅<br>
9. Royalty ✅
</div>

<div id="apps"></div>

<script>
const BACKEND = "https://vinu-js-backend.onrender.com";
let USER_ID = localStorage.getItem('vinu_id') || 'USER_' + Date.now();
localStorage.setItem('vinu_id', USER_ID);
let balance = 0;

async function checkHealth(){
 try{
  let r = await fetch(BACKEND + '/');
  if(r.ok){ document.getElementById('status').innerHTML='Online ✅'; document.getElementById('status').className='online'; }
  else{ throw 'off' }
 }catch{ document.getElementById('status').innerHTML='Offline ❌ (30s wait)'; document.getElementById('status').className='offline'; }
 getWallet();
}

async function getWallet(){
 try{
  let res = await fetch(BACKEND + '/api/wallet/' + USER_ID);
  let data = await res.json();
  balance = data.balance || 0;
  document.getElementById('balance').innerText = 'Rs.' + balance;
 }catch{}
}

async function claim(app){
 // Level 1 Self Earning
 let res = await fetch(BACKEND + '/api/claim', {
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body: JSON.stringify({userId: USER_ID, appName: app})
 });
 let d = await res.json();
 if(d.success){
  alert('Rs.' + d.earned + ' Added! ' + d.msg);
  getWallet();
  if(d.taskBonus) alert('🎉 TASK BONUS: ' + d.taskBonus);
  if(d.adBonus) alert('🔥 AD BONUS: ' + d.adBonus);
  window.open('https://play.google.com/store', '_blank');
 }
}

const appList = ["Meesho","PhonePe","Dream11","Moj","RozDhan","WinZo","Upstox","Groww","Paytm","Google Pay"];
let html='';
appList.forEach(a=>{
 html+=`<div class="card"><span>${a} - Earn Rs.2</span><button class="btn" onclick="claim('${a}')">Open & Earn</button></div>`;
});
document.getElementById('apps').innerHTML=html;
checkHealth();
</script>
</body>
</html>
