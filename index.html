<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VINOD AVJS ENTERTAINMENT - Real Earning</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#fff;font-family:Arial}
header{position:sticky;top:0;z-index:10;background:#10101f;padding:12px;text-align:center;border-bottom:1px solid #2a2a4a}
.logo{color:#ffcc00;font-weight:900;letter-spacing:1px}
.bal{margin-top:8px;background:linear-gradient(90deg,#ffcc00,#ffb700);color:#000;display:inline-block;padding:6px 18px;border-radius:20px;font-weight:bold}
.wallet-box{display:flex;gap:8px;justify-content:center;margin-top:10px}
.wallet-box button{background:#1f1f3a;color:#fff;border:1px solid #3a3a6a;padding:6px 12px;border-radius:20px;font-size:12px}
.grid{padding:10px;display:flex;flex-direction:column;gap:8px}
.card{background:linear-gradient(145deg,#16162a,#121223);border:1px solid #2a2a4a;border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px}
.card img{width:44px;height:44px;border-radius:10px;background:#fff;object-fit:contain}
.card .info{flex:1}
.card .info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.card .info small{color:#8a8ab0;font-size:11px}
.btn{border:none;padding:7px 14px;border-radius:20px;font-weight:800;font-size:11px;letter-spacing:.5px}
.btn-earn{background:linear-gradient(90deg,#ffcc00,#ff9d00);color:#000}
.btn-install{background:linear-gradient(90deg,#7c4dff,#4a00e0);color:#fff}
</style>
</head>
<body>
<header>
<div class="logo">👑 VINOD AVJS ENTERTAINMENT 👑</div>
<div class="bal" id="balance">₹0.00</div>
<div class="wallet-box">
<button onclick="loadBalance()">🔄 Refresh</button>
<button onclick="withdraw()">💸 Withdraw (Min ₹100)</button>
</div>
</header>

<div class="grid" id="appList"></div>

<script>
const API_BASE = "https://vinu-js-backend.onrender.com"; // <-- Apna Render URL yahan daalo
const userId = localStorage.getItem('vinod_id') || 'VINOD_'+Date.now();
localStorage.setItem('vinod_id', userId);

const APPS_DATA = [
"Top Rummy","YouTube","JioSaavn","Instagram","Flipkart","Gullak Gold","Meesho","Google Pay","True Balance","ShareChat","MX TakaTak","Moj","Josh","Dream11","WinZO","Ludo King","Zupee","MPL","PhonePe","Paytm","TaskBucks","RozDhan","Google Opinion","VidMate","Snapchat","Telegram","Whatsapp","Facebook","Chingari","Roposo"
];

function getIcon(name){
  let domain = name.toLowerCase().replace(/\s+/g,'')+".com";
  if(name.includes("YouTube")) domain="youtube.com";
  if(name.includes("Instagram")) domain="instagram.com";
  if(name.includes("Google Pay")||name.includes("GPay")) domain="pay.google.com";
  return `https://logo.clearbit.com/${domain}?size=128`;
}

const FINAL_APPS = [];
for(let i=0;i<310;i++){
  let baseName = APPS_DATA[i % APPS_DATA.length];
  let name = i<30? baseName : baseName+" "+(Math.floor(i/30)+1);
  let isEarning = i < 14; // Pehle 14 hi Real Earning wale hain
  FINAL_APPS.push({
    id:i+1,
    name:name,
    cat: isEarning? "Real Earning" : "Install & Earn",
    icon:getIcon(baseName),
    reward: isEarning? (i<5? 10 : 3) : 0,
    network: isEarning? ["admob","facebook","ironsource","unity"][i%4] : "none"
  });
}

function render(){
  document.getElementById('appList').innerHTML = FINAL_APPS.map(app=>`
    <div class="card">
      <img src="${app.icon}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5968/5968764.png'">
      <div class="info"><b>${app.name}</b><small>${app.cat} • ${app.network.toUpperCase()}</small></div>
      ${app.reward>0? `<button class="btn btn-earn" onclick="realEarn('${app.network}',${app.reward})">Earn ₹${app.reward}</button>` : `<button class="btn btn-install" onclick="window.open('https://play.google.com/store/search?q=${encodeURIComponent(app.name)}','_blank')">Install</button>`}
    </div>
  `).join('');
}

// REAL EARNING SYSTEM - SSV Protected
async function realEarn(network, reward){
  if(!confirm(`${network.toUpperCase()} ka 15 sec ad dekho, ₹${reward} milega?`)) return;
  const signature = `${network}_${Date.now()}_${Math.random().toString(36).slice(2)}`;
  
  // Yahan aapka AdMob / Meta ka real ad dikhega
  // Ad pura dekhne ke baad hi ye call hoga
  try{
    const res = await fetch(`${API_BASE}/api/reward/verify`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({userId, network, reward, signature})
    });
    const data = await res.json();
    if(data.success){ alert(`✅ ₹${data.reward} Wallet me add ho gaya!`); loadBalance(); }
    else alert("❌ "+data.message);
  }catch(e){ alert("Server se connect nahi ho raha. Render URL check karo."); }
}

async function loadBalance(){
  try{
    const r = await fetch(`${API_BASE}/api/wallet/${userId}`);
    const d = await r.json();
    document.getElementById('balance').innerText = `₹${(d.balance||0).toFixed(2)}`;
  }catch(e){}
}

async function withdraw(){
  const upi = prompt("Apna UPI ID daalo (jaise vinod@okicici):");
  if(!upi) return;
  const amt = prompt("Kitna withdraw karna hai? Min ₹100");
  if(!amt || Number(amt)<100) return alert("Min ₹100");
  const res = await fetch(`${API_BASE}/api/withdraw`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId, upiId:upi, amount:Number(amt)})});
  const d = await res.json();
  alert(d.message || d.error);
}

render(); loadBalance();
</script>
</body>
</html>
