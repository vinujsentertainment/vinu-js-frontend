<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

</head>
<body>
<h2 style="color:#00ff88">💰 VINOD AVJS - Back</h2>
<p id="status" style="color:yellow">Loading...</p>
<div id="list"></div>

<script>
const API_BASE = "https://vinu-js-backend.onrender.com";
const APPS = [
  {id:1,name:"WinZO",cat:"Games",pkg:"com.winzo.play",icon:"https://play-lh.googleusercontent.com/8b1a2a2a2a2a2a2a2a2a2a",reward:10,earn:true},
  {id:2,name:"Kuku FM",cat:"Video",pkg:"com.vlv.aravali",icon:"https://play-lh.googleusercontent.com/9c1a2a2a2a2a2a",reward:10,earn:true},
  {id:3,name:"Rigi",cat:"Video",pkg:"com.rigi",icon:"https://logo.clearbit.com/rigi.club",reward:5,earn:true},

    <button style="${a.earn?'background:#00ff88':'background:#333;color:#888'}" onclick="alert('${a.earn?'Earn ₹'+a.reward:'Install - No Earning'}')">${a.earn?'Earn ₹'+a.reward:'Install'}</button>
  </div>
`).join('');
</script>
