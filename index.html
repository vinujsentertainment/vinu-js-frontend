<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLS VINU 2.0 - MD Vinod Baidoriya</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial}
.top{background:#000;border-bottom:2px solid #ffcc00;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.founder{background:linear-gradient(90deg,#ffcc00,#ff9900);color:#000;padding:8px 12px;text-align:center;font-weight:900;font-size:12px;letter-spacing:.5px}
.founder span{background:#000;color:#ffcc00;padding:2px 6px;border-radius:4px;margin-left:4px}
.wallet{margin:10px;background:#151515;border:1.5px solid #ffcc00;border-radius:14px;padding:10px}
.profit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.profit div{background:#000;border:1px solid #333;border-radius:8px;padding:6px;text-align:center}
.profit b{color:#ffcc00;font-size:14px}
.tabs{display:flex;gap:6px;overflow:auto;padding:8px;background:#070707;position:sticky;top:36px;z-index:9}
.tabs button{background:#1a1a1a;border:1px solid #333;color:#fff;padding:6px 12px;border-radius:20px;white-space:nowrap;font-size:12px}
.tabs button.active{background:#ffcc00;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.card{background:#151515;border:1px solid #262626;border-radius:14px;padding:8px;text-align:center}
.card img{width:48px;height:48px;border-radius:12px;background:#fff}
.name{font-size:11px;margin:4px 0}.earn{font-size:10px;color:#aaa}.price{color:#ffcc00;font-weight:bold;font-size:12px}
.btn{width:100%;margin-top:5px;background:#00c853;color:#fff;border:none;padding:6px;border-radius:8px;font-size:11px;font-weight:bold}
.btn.use{background:#ffcc00;color:#000}
.timer{font-size:9px;color:#25D366;margin-top:3px;font-weight:bold}
.footer{margin:10px;background:#141414;border:1px solid #333;border-radius:12px;padding:12px}
.footer input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
.mainbtn{width:100%;background:#ffcc00;color:#000;border:none;padding:12px;border-radius:10px;font-weight:900}
</style>
</head>
<body>
<div class="top"><b>VLS - VINU 2.0</b><div style="font-size:12px">₹<b id="bal" style="color:#ffcc00">0</b> | C:<b id="coins">0</b></div></div>
<div class="founder">👑 MD & FOUNDER - <span>Mr. Vinod Baidoriya</span> | 70% Users | 30% Company</div>

<div class="wallet">
<div style="display:flex;justify-content:space-between"><div><small>My Balance (70%)</small><div style="color:#ffcc00;font-size:22px;font-weight:800">₹<span id="bal2">0</span></div></div><div style="text-align:right"><small>Code: <b id="mycode" style="color:#ffcc00">VINU0000</b></small><br><button onclick="daily()" style="margin-top:4px;background:#ffcc00;border:none;padding:6px 12px;border-radius:6px;font-weight:bold;font-size:11px">🎁 Daily +10</button></div></div>
<div class="profit">
<div><small>Total Profit</small><br><b id="totalProfit">₹0</b></div>
<div><small>Users (70%)</small><br><b id="userProfit" style="color:#00e676">₹0</b></div>
<div><small>Aapka (30%)</small><br><b id="myProfit" style="color:#ffcc00">₹0</b></div>
</div>
<div style="font-size:9px;color:#888;margin-top:6px;text-align:center">App jitna use hoga, utna earning. Har 1 Min Use = ₹1. Ad se company ko extra profit.</div>
</div>

<div class="tabs" id="tabs"></div>
<div id="list"></div>

<div class="footer">
<b>Withdraw - 70% Earning</b>
<input id="upi" placeholder="UPI ID">
<input id="amt" type="number" placeholder="Min ₹100">
<button class="mainbtn" onclick="withdraw()">WITHDRAW KARO</button>
</div>

<script>
const OWNER="91968517704";
const apps=[
["Facebook","Social","https://img.icons8.com/color/96/facebook.png",22,"com.facebook.katana"],
["Instagram","Social","https://img.icons8.com/color/96/instagram-new.png",22,"com.instagram.android"],
["WhatsApp","Social","https://img.icons8.com/color/96/whatsapp.png",20,"com.whatsapp"],
["Telegram","Social","https://img.icons8.com/color/96/telegram-app.png",20,"org.telegram.messenger"],
["YouTube","OTT","https://img.icons8.com/color/96/youtube-play.png",30,"com.google.android.youtube"],
["Netflix","OTT","https://img.icons8.com/color/96/netflix.png",35,"com.netflix.mediaclient"],
["Hotstar","OTT","https://img.icons8.com/color/96/disney-plus.png",30,"in.startv.hotstar"],
["Amazon","Shopping","https://img.icons8.com/color/96/amazon.png",25,"com.amazon.mShop.android.shopping"],
["PhonePe","Payment","https://img.icons8.com/color/96/phone.png",35,"com.phonepe.app"],
["Paytm","Payment","https://img.icons8.com/color/96/paytm.png",35,"net.one97.paytm"],
["Dream11","Gaming","https://img.icons8.com/color/96/trophy.png",40,"com.dream11sportsguru"],
["Free Fire","Gaming","https://img.icons8.com/color/96/game-controller.png",30,"com.dts.freefireth"],
["RozDhan","Earning","https://img.icons8.com/color/96/coins.png",30,"com.rozdhan.wallet"]
];
let bal=parseInt(localStorage.getItem("vls_bal")||"0");
let coins=parseInt(localStorage.getItem("vls_coins")||"0");
let total=parseInt(localStorage.getItem("vls_total")||"0");
let code=localStorage.getItem("vls_code")||"VINU"+Math.floor(1000+Math.random()*9000);
localStorage.setItem("vls_code",code);
let active="All"; const cats=["All","Social","OTT","Shopping","Payment","Gaming","Earning"];
let installed=JSON.parse(localStorage.getItem("vls_installed")||"{}");

function renderTabs(){document.getElementById("tabs").innerHTML=cats.map(c=>`<button class="${active==c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("")}
function renderApps(){
let f=active=="All"?apps:apps.filter(a=>a[1]==active);
let g={};f.forEach(a=>{if(!g[a[1]])g[a[1]]=[];g[a[1]].push(a)});
let h="";Object.keys(g).forEach(k=>{
h+=`<div style="padding:8px 10px 0;color:#ffcc00;font-weight:bold;font-size:12px">${k}</div><div class="grid">`;
g[k].forEach(a=>{
let isInstalled=installed[a[0]];
h+=`<div class="card"><img src="${a[2]}"><div class="name">${a[0]}</div><div class="price">₹${a[3]} Install</div><div class="earn">Use = ₹1/min</div>
${isInstalled?`<button class="btn use" onclick="useApp('${a[0]}',this)">▶️ USE & EARN</button><div class="timer" id="t-${a[0]}">${isInstalled.mins||0} min used</div>`:`<button class="btn" onclick="installApp('${a[0]}',${a[3]},'${a[4]}',this)">Install</button>`}
</div>`;
});h+=`</div>`;});
document.getElementById("list").innerHTML=h;
}
function update(){
document.getElementById("bal").innerText=bal;document.getElementById("bal2").innerText=bal;document.getElementById("coins").innerText=coins;document.getElementById("mycode").innerText=code;
let myShare=Math.floor(total*0.3); let userShare=Math.floor(total*0.7);
document.getElementById("totalProfit").innerText="₹"+total;
document.getElementById("userProfit").innerText="₹"+userShare;
document.getElementById("myProfit").innerText="₹"+myShare;
localStorage.setItem("vls_bal",bal);localStorage.setItem("vls_coins",coins);localStorage.setItem("vls_total",total);localStorage.setItem("vls_installed",JSON.stringify(installed));
}
function setCat(c){active=c;renderTabs();renderApps();}
function installApp(name,amt,pkg,btn){
btn.innerText="Opening Store...";
window.open("https://play.google.com/store/apps/details?id="+pkg,"_blank");
setTimeout(()=>{
installed[name]={mins:0,amt:amt}; bal+=amt; total+=amt; coins+=amt; update(); renderApps();
alert(name+" Download Started! Ab USE & EARN pe click karke app use karo, har minute ka paisa milega!");
},1500);
}
function useApp(name,btn){
btn.innerText="⏳ Using... Earning ON";
window.open("https://play.google.com/store/apps/details?id="+apps.find(a=>a[0]==name)[4],"_blank");
let sec=0;
let iv=setInterval(()=>{
sec++; btn.innerText=`Earning... ${sec}s`;
if(sec>=60){clearInterval(iv); installed[name].mins=(installed[name].mins||0)+1; let earn=1; bal+=earn; total+=earn; coins+=earn; update(); renderApps(); alert(name+" 1 Min Use Complete! ₹1 Added! Jitna use karoge utna paisa! (70% aapko, 30% MD ko)"); }
},1000);
}
function daily(){if(localStorage.getItem("vls_d")==new Date().toDateString())return alert("Aaj ka le liya!");bal+=10;total+=10;localStorage.setItem("vls_d",new Date().toDateString());update();alert("+10 Added");}
function withdraw(){
let upi=document.getElementById("upi").value; let amt=parseInt(document.getElementById("amt").value);
if(!upi||amt<100)return alert("UPI aur 100 Min"); if(amt>bal)return alert("Balance kam hai");
let msg=`🔔 WITHDRAW%0AMember: ${code}%0AUPI: ${upi}%0AAmt: ₹${amt} (70%)%0ACompany Profit (30%): ₹${Math.floor(amt*30/70)}%0ATotal Biz: ₹${total}`;
bal-=amt;update();
window.open(`https://wa.me/${OWNER}?text=${msg}`,"_blank");
alert("Withdraw request MD Vinod Baidoriya ko bhej diya!");
}
renderTabs();renderApps();update();
</script>
</body>
</html>
