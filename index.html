<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINOD AVJS ENTERTAINMENT</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0}header{background:#111;padding:15px;text-align:center;border-bottom:2px solid #ffcc00}header h1{color:#ffcc00;margin:0;font-size:20px}.bal{background:#ffcc00;color:#000;padding:6px 15px;border-radius:20px;font-weight:bold;display:inline-block;margin-top:8px}.app{background:#181818;margin:8px;padding:12px;border-radius:12px;display:flex;gap:10px;align-items:center;border:1px solid #222}.app img{width:48px;height:48px;border-radius:10px;background:#fff;object-fit:contain}.app button{margin-left:auto;background:#ffcc00;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:bold}.cat{padding:10px;background:#222;margin:5px;border-radius:20px;display:inline-block;font-size:12px}</style>
</head><body>
<header><h1>👑 VINOD AVJS ENTERTAINMENT</h1><div class="bal" id="bal">₹0</div><div style="margin-top:10px"><span class="cat" onclick="filterCat('All')">All 310</span><span class="cat" onclick="filterCat('Games')">Games</span><span class="cat" onclick="filterCat('Video')">Kuku/Rigi</span><span class="cat" onclick="filterCat('Finance')">Finance</span></div></header>
<div id="list" style="padding:10px"></div>

<script>
const API = "https://vinu-js-backend.onrender.com";
const userId = localStorage.getItem('vje_user') || 'VJE_'+Math.floor(Math.random()*900000+100000);
localStorage.setItem('vje_user', userId);

const REAL_APPS = [
{name:"WinZO Gold", cat:"Games", domain:"winzogames.com", reward:10, net:"ironsource"},
{name:"Kuku FM Stories", cat:"Video", domain:"kukufm.com", reward:3, net:"facebook"},
{name:"Rigi - Learn & Earn", cat:"Video", domain:"rigi.club", reward:3, net:"pangle"},
{name:"Moj Video", cat:"Video", domain:"mojapp.in", reward:2, net:"applovin"},
{name:"PhonePe", cat:"Finance", domain:"phonepe.com", reward:2, net:"adpumb"},
{name:"Meesho Resell", cat:"Shopping", domain:"meesho.com", reward:2, net:"unity"},
{name:"Dream11", cat:"Games", domain:"dream11.com", reward:5, net:"admob"},
{name:"ShareChat", cat:"Social", domain:"sharechat.com", reward:2, net:"facebook"}
];
// 310 tak unique banane ke liye
const ALL = [];
for(let i=0;i<310;i++){
  let b = REAL_APPS[i % REAL_APPS.length];
  let name = i < 8? b.name : b.name.split(' ')[0] + " " + (i+1);
  ALL.push({id:i+1, name:name, cat:b.cat, domain:b.domain, icon:`https://logo.clearbit.com/${b.domain}?size=128`, reward:b.reward, net:b.net, isEarn: i < 14});
}

function render(cat){
  let f = cat==='All'? ALL : ALL.filter(a=>a.cat===cat);
  document.getElementById('list').innerHTML = f.map(a=>`
  <div class="app"><img src="${a.icon}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5968/5968764.png'"><div><b>${a.name}</b><br><small>${a.cat} • ${a.net} • ${a.isEarn?'Earning':''}</small></div>
  ${a.isEarn? `<button onclick="earn('${a.net}',${a.reward})">Earn ₹${a.reward}</button>` : `<button style="background:#222;color:#888" onclick="window.open('https://play.google.com/store/search?q=${a.name}','_blank')">Install</button>`}
  </div>`).join('');
}
async function earn(network, reward){
  if(!confirm(network.toUpperCase()+" ka 15 sec Ad dekho, ₹"+reward+" milega?")) return;
  const sig = network + "_" + Date.now() + "_" + Math.random();
  const r = await fetch(API+"/api/reward/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId, network, signature:sig})});
  const d = await r.json();
  alert(d.success? `₹${d.reward} Mil Gaya!` : d.message);
  loadBal();
}
async function loadBal(){ try{ const r=await fetch(API+"/api/wallet/"+userId); const d=await r.json(); document.getElementById('bal').innerText="₹"+d.balance; }catch(e){} }
function filterCat(c){ render(c); }
render('All'); loadBal();
</script>
</body></html>
