function renderCats(){
  document.getElementById('catBar').innerHTML = categories.map(c=> 
    `<button onclick="filterCat('${c}')" class="${currentCat===c?'bg-white text-black font-bold':'bg-[#1c1f36]'} px-4 py-1.5 rounded-full text-sm whitespace-nowrap">${c}</button>`
  ).join('');
}

function render(){
  document.getElementById('wallet').innerText = wallet;
  renderCats();
  const list = document.getElementById('appList');
  list.innerHTML = '';
  apps.filter(a => currentCat==='All' || a.cat===currentCat).forEach(app=>{
    const isDone = claimed.includes(app.id);
    list.innerHTML += `
    <div class="bg-[#1c1f36] p-3 rounded-xl flex justify-between items-center">
      <div>
        <h3 class="font-bold text-[15px]">${app.name}</h3>
        <p class="text-xs text-gray-400">${app.cat} • ₹${app.reward}</p>
      </div>
      <button id="btn-${app.id}" onclick="startTask(${app.id})" 
      class="${isDone?'bg-zinc-700 text-gray-400':'bg-green-400 text-black'} px-4 py-2 rounded-lg text-sm font-bold">
        ${isDone?'Claimed':'Earn ₹'+app.reward}
      </button>
    </div>`;
  });
}
