<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROYAL KING</title><script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><style>body{background:#0a0a0a;color:#fff;font-family:system-ui}.page{display:none}.page.active{display:block}.botnav{position:fixed;bottom:0;left:0;right:0;background:#141414;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #222;z-index:99}.nav{padding:6px 14px;border-radius:20px;text-align:center;font-size:11px;font-weight:800;color:#777;cursor:pointer}.nav.active{background:#FFD700;color:#000}.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:18px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}</style></head><body>
<div class="p-3 flex justify-between items-center bg-black border-b border-yellow-600/30 sticky top-0 z-40"><h1 class="font-black text-yellow-400 text-[15px]">VINOD AVJS ROYAL KING 👑</h1><div class="bg-yellow-400 text-black px-4 py-1 rounded-full font-black text-sm">₹<span id="b1">0</span></div></div>
<div id="p-home" class="page active p-3"><div class="bg-yellow-400 text-black p-4 rounded-[20px]"><p class="text-[10px] font-black">ID: <span id="u1"></span> | REF: <span id="r1"></span></p><h2 class="text-xl font-black mt-1">VERIFIED EARNING - SSV</h2><button onclick="initAd()" class="bg-black text-yellow-400 px-4 py-2 rounded-full text-xs mt-2 font-bold">Load Ad</button><p id="adS" class="text-[10px] mt-2 font-bold">Ad Status: Not Loaded</p></div><div class="grid grid-cols-3 gap-2 mt-3"><div onclick="earn('daily')" class="bg-[#1c1c1c] p-3 rounded-xl text-center text-xs font-bold">📅 Daily ₹2</div><div onclick="earn('spin')" class="bg-[#1c1c1c] p-3 rounded-xl text-center text-xs font-bold">🎡 Spin ₹5</div><div onclick="watchAd()" class="bg-[#1c1c1c] p-3 rounded-xl text-center text-xs font-bold">🎥 Ad ₹2</div></div></div>
<div id="p-apps" class="page p-3"><div id="aList"></div></div>
<div id="p-wallet" class="page p-3"><div class="bg-[#1c1c1c] p-5 rounded-[20px] text-center"><h1 class="text-3xl font-black text-yellow-400">₹<span id="b2">0</span></h1><p class="text-xs text-gray-400">Total: ₹<span id="tot">0</span></p><input id="upi" placeholder="UPI ID" class="w-full bg-black border border-[#333] p-3 rounded-xl mt-3 text-sm"><button onclick="wd()" class="w-full bg-yellow-400 text-black p-3 rounded-xl mt-2 font-black">Withdraw ₹100</button></div></div>
<div id="p-history" class="page p-3"><div id="hList" class="bg-[#1c1c1c] p-4 rounded-[20px] text-xs"></div></div>
<div id="p-profile" class="page p-3"><div class="bg-[#1c1c1c] p-5 rounded-[20px] text-center"><h2 class="font-black text-yellow-400">VINOD BAIDORIYA - MD</h2><p id="u2" class="text-xs mt-2"></p><p id="r2" class="text-xs"></p><input id="refIn" placeholder="Refer Code" class="w-full bg-black border border-[#333] p-2 rounded-xl mt-3 text-xs"><button onclick="applyRef()" class="w-full bg-[#2a2a2a] p-2 rounded-xl mt-2 text-xs font-bold">Apply</button></div></div>
<div class="h-20"></div><div class="botnav"><div class="nav active" onclick="openP('home')">Home</div><div class="nav" onclick="openP('apps')">Tasks</div><div class="nav" onclick="openP('wallet')">Wallet</div><div class="nav" onclick="openP('history')">History</div><div class="nav" onclick="openP('profile')">Profile</div></div>
<script>
const BACKEND="https://js-backend.onrender.com"; let uid=localStorage.getItem('rk_uid')||'RK_'+Math.random().toString(36).slice(2,9).toUpperCase(); localStorage.setItem('rk_uid',uid); let slot=null;
function openP(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active'); if(['home','wallet','history'].includes(p)) loadW();}
function initAd(){document.getElementById('adS').innerText='Loading...'; googletag.cmd.push(()=>{slot=googletag.defineOutOfPageSlot('/22639388115/rewarded',googletag.enums.OutOfPageFormat.REWARDED).addService(googletag.pubads()); googletag.pubads().addEventListener('rewardedSlotReady',e=>{document.getElementById('adS').innerText='✅ Ad Ready'; e.makeRewardedVisible();}); googletag.pubads().addEventListener('rewardedSlotGranted',()=>{document.getElementById('adS').innerText='✅ SSV sent!'; setTimeout(loadW,4000);}); googletag.pubads().setCustomData(uid); googletag.enableServices(); googletag.display(slot);});}
function watchAd(){ if(!slot) return initAd(); googletag.cmd.push(()=>googletag.display(slot));}
const APPS=[{n:"PhonePe",p:"com.phonepe.app"},{n:"Google Pay",p:"com.google.android.apps.nbu.paisa.user"},{n:"Paytm",p:"net.one97.paytm"},{n:"Flipkart",p:"com.flipkart.android"}].map((a,i)=>({...a,icon:`https://www.google.com/s2/favicons?domain=${a.p}&sz=128`,r:10, id:i}));
function render(){document.getElementById('aList').innerHTML=APPS.map(a=>`<div class="card"><div class="flex gap-2 items-center"><img src="${a.icon}" class="w-10 h-10 bg-white rounded-lg p-1"><b class="text-sm">${a.n}</b></div><button onclick="watchAd()" class="bg-yellow-400 text-black px-3 py-2 rounded-full text-xs font-black">Earn ₹${a.r}</button></div>`).join('');}
async function earn(t){let r=await fetch(BACKEND+'/api/earn/'+t,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid})}); let d=await r.json(); alert(d.success?`₹${d.reward}`:d.message); loadW();}
async function loadW(){document.getElementById('u1').innerText=uid;document.getElementById('u2').innerText=uid; try{let r=await fetch(BACKEND+'/api/wallet/'+uid); let d=await r.json(); document.getElementById('b1').innerText=(d.balance||0).toFixed(2); document.getElementById('b2').innerText=(d.balance||0).toFixed(2); document.getElementById('tot').innerText=d.total_earned||0; document.getElementById('r1').innerText=d.referral_code; document.getElementById('r2').innerText=d.referral_code;}catch{} try{let r=await fetch(BACKEND+'/api/history/'+uid); let d=await r.json(); document.getElementById('hList').innerHTML=d.transactions.map(x=>`<div class="flex justify-between py-2 border-b border-[#222]"><span>${x.description}</span><b class="${x.amount>0?'text-green-400':'text-red-400'}">${x.amount>0?'+':''}₹${x.amount}</b></div>`).join('');}catch{}}
function wd(){let u=document.getElementById('upi').value; fetch(BACKEND+'/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,amount:100,upiId:u})}).then(r=>r.json()).then(d=>alert(d.message));}
function applyRef(){let c=document.getElementById('refIn').value; fetch(BACKEND+'/api/referral/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,referralCode:c})}).then(r=>r.json()).then(d=>alert(d.message));}
render(); loadW();
</script></body></html>
