<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;padding:10px}
.app-card{background:#1e1e1e;padding:12px;margin:10px 0;border-radius:10px;display:flex;justify-content:space-between}
button{background:gold;color:#000;padding:8px 15px;border:none;border-radius:5px;font-weight:bold}
#balance{color:gold;font-size:20px}
</style>

<body>

<h2>👑 VINU JS ROYAL KING - REAL</h2>
<div>Balance: <span id="balance">₹0</span> | <span id="backend">Checking Backend...</span></div>

<div id="apps"></div>

<script>
// ========= CONFIG - REAL =========
const BACKEND = "https://vinu-js-backend.onrender.com";
const SMARTLINK = "https://www.highperformanceformat.com/31092163"; // Aapka Real Smartlink - Adsterra > Smartlink_1 > GET LINK se exact link lo
const USER_ID = localStorage.getItem('vinu_id') || 'VINU_'+Math.floor(Math.random()*10000);
localStorage.setItem('vinu_id', USER_ID);

// Backend Status Check
fetch(BACKEND+'/api/health').then(r=>r.json()).then(d=>{
  document.getElementById('backend').innerText = "Backend LIVE ✅";
}).catch(()=>{ document.getElementById('backend').innerText = "Backend OFFLINE ❌"; });

// 300 Apps Load
const appsDiv = document.getElementById('apps');
for(let i=1;i<=300;i++){
  appsDiv.innerHTML += `<div class="app-card"><span>App ${i} - Real Ad Earning</span><button onclick="openRealApp(${i})">OPEN ₹2</button></div>`;
}

// ========= REAL EARNING LOGIC =========
async function openRealApp(appId){
  // 1. REAL AD - Adsterra Smartlink kholo - isse aapko real $ milega
  window.open(SMARTLINK, '_blank');

  // 2. Backend ko bolo reward verify karke do (Duplicate + Ledger Protection)
  try{
    const res = await fetch(BACKEND+'/api/reward', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        userId: USER_ID,
        appId: appId,
        task_type: 'app_open',
        adProvider: 'adsterra',
        adUnitId: '31092163'
      })
    });
    const data = await res.json();
    if(data.success){
      document.getElementById('balance').innerText = '₹'+data.newBalance;
      alert('✅ ₹2 Added! Adsterra Earning Counted');
    } else {
      alert('⚠️ '+data.error); // 1 app 1 din me 1 bar hi
    }
  } catch(e){
    alert('Backend abhi so raha hai, 30 sec me retry karo');
  }
}

// Wallet History
async function loadWallet(){
  const r = await fetch(BACKEND+`/api/wallet/${USER_ID}`);
  const d = await r.json();
  if(d.balance) document.getElementById('balance').innerText = '₹'+d.balance;
}
loadWallet();
</script>
