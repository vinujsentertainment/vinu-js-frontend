<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VINOD AVJS - Final</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff}header{background:#111;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}header h2{color:#00ff88;font-size:16px}#balHead{background:#00ff88;color:#000;padding:5px 12px;border-radius:20px;font-weight:bold}.tabs{display:flex;background:#111;position:sticky;top:54px;z-index:9}.tabs button{flex:1;padding:12px;background:none;border:none;color:#777;font-weight:bold;border-bottom:2px solid transparent}.tabs button.active{color:#00ff88;border-color:#00ff88}.page{display:none;padding:12px}.page.active{display:block}.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.cat{background:#1c1c1c;padding:16px;border-radius:12px;border:1px solid #222;text-align:center}.app{background:#181818;border:1px solid #222;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:8px}.app img{width:48px;height:48px;border-radius:10px;background:#fff;object-fit:cover}.wallet-card{background:linear-gradient(135deg,#00ff88,#00ccff);color:#000;padding:20px;border-radius:16px;text-align:center}.form{background:#181818;padding:15px;border-radius:12px;margin-top:12px;border:1px solid #222}.form input{width:100%;padding:12px;border-radius:8px;border:none;background:#222;color:#fff;margin:6px 0}.form button{width:100%;padding:12px;background:#00ff88;border:none;border-radius:8px;font-weight:bold}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}th,td{border:1px solid #222;padding:8px}th{background:#222}</style>
</head><body>
<header><h2>💰 VINOD AVJS</h2><div id="balHead">₹0</div></header>
<div class="tabs"><button id="t-home" class="active" onclick="openPage('home')">HOME</button><button id="t-earn" onclick="openPage('earn')">EARN</button><button id="t-wallet" onclick="openPage('wallet')">WALLET</button><button id="t-admin" onclick="openPage('admin')">ADMIN</button></div>

<div id="page-home" class="page active">
<h3>Category Wise Earning</h3>
<div class="cat-grid">
<div class="cat" onclick="openCategory('Social')"><b>Social</b><br><span>82 Apps</span><br><small style="color:#00ff88">5 Earning Apps</small></div>
<div class="cat" onclick="openCategory('Games')"><b>Games</b><br><span>75 Apps</span><br><small style="color:#00ff88">2 Earning Apps</small></div>
<div class="cat" onclick="openCategory('Shopping')"><b>Shopping</b><br><span>60 Apps</span></div>
<div class="cat" onclick="openCategory('Finance')"><b>Finance</b><br><span>45 Apps</span><br><small style="color:#00ff88">2 Earning Apps</small></div>
<div class="cat" onclick="openCategory('Video')"><b>Video</b><br><span>48 Apps</span></div>
<div class="cat" onclick="openCategory('All')"><b>All Apps</b><br><span>310 Apps</span><br><small>9 Earning Only</small></div>
</div>
</div>

<div id="page-earn" class="page"><div id="filterInfo" style="margin-bottom:10px;font-weight:bold;color:#00ff88"></div><div id="appList"></div></div>
<div id="page-wallet" class="page"><div class="wallet-card"><h1 id="bigBal">₹0</h1><p>Balance</p><small>Min ₹100 Withdraw</small></div><div class="form"><h3>UPI Withdrawal</h3><input id="upi" placeholder="UPI ID - ex: 9876543210@paytm"><input id="amt" type="number" placeholder="Amount - 100"><button onclick="doWithdraw()">Withdraw Now</button><p id="wMsg" style="color:#00ff88;margin-top:8px"></p></div></div>
<div id="page-admin" class="page"><div class="form"><input id="adminKey" type="password" placeholder="Admin Key VINOD123"><button onclick="loadAdmin()">Load Data</button></div><table><thead><tr><th>ID</th><th>User</th><th>₹</th><th>UPI</th><th>Status</th></tr></thead><tbody id="adminBody"></tbody></table></div>

<script>
const API_BASE = "https://vinu-js-backend.onrender.com";
const EARNING_APP_IDS = [1,2,3,4,5,10,15,20,25];

const REAL_APPS = [
  {n:"WhatsApp", c:"Social", p:"com.whatsapp", i:"https://cdn-icons-png.flaticon.com/512/124/124034.png"},
  {n:"Instagram", c:"Social", p:"com.instagram.android", i:"https://cdn-icons-png.flaticon.com/512/2111/2111463.png"},
  {n:"Facebook", c:"Social", p:"com.facebook.katana", i:"https://cdn-icons-png.flaticon.com/512/124/124010.png"},
  {n:"Telegram", c:"Social", p:"org.telegram.messenger", i:"https://cdn-icons-png.flaticon.com/512/2111/2111646.png"},
  {n:"Snapchat", c:"Social", p:"com.snapchat.android", i:"https://cdn-icons-png.flaticon.com/512/2111/2111661.png"},
  {n:"PhonePe", c:"Finance", p:"com.phonepe.app", i:"https://cdn-icons-png.flaticon.com/512/5968/5968488.png"},
  {n:"Paytm", c:"Finance", p:"net.one97.paytm", i:"https://cdn-icons-png.flaticon.com/512/825/825454.png"},
  {n:"Meesho", c:"Shopping", p:"com.meesho.supply", i:"https://cdn-icons-png.flaticon.com/512/2331/2331966.png"},
  {n:"Flipkart", c:"Shopping", p:"com.flipkart.android", i:"https://cdn-icons-png.flaticon.com/512/825/825462.png"},
  {n:"Dream11", c:"Games", p:"com.dream11.fantasy_cricket.league", i:"https://cdn-icons-png.flaticon.com/512/2947/2947156.png"},
  {n:"Ludo King", c:"Games", p:"com.ludo.king", i:"https://cdn-icons-png.flaticon.com/512/808/808439.png"},
  {n:"YouTube", c:"Video", p:"com.google.android.youtube", i:"https://cdn-icons-png.flaticon.com/512/1384/1384060.png"},
  {n:"MX Player", c:"Video", p:"com.mxtech.videoplayer.ad", i:"https://cdn-icons-png.flaticon.com/512/2504/2504965.png"},
  {n:"Amazon", c:"Shopping", p:"com.amazon.mShop.android.shopping", i:"https://cdn-icons-png.flaticon.com/512/1409/1409946.png"}
];

const APP_DATA=[];
for(let id=1; id<=310; id++){
  let b = REAL_APPS[(id-1) % REAL_APPS.length];
  APP_DATA.push({id:id, name:b.n + (id>14 ? " "+id : ""), c:b.c, pkg:b.p, icon:b.i, reward: EARNING_APP_IDS.includes(id) ? (id%2==0?10:5) : 0 });
}

const userId=localStorage.getItem('earn_user')||'USER_'+Math.floor(Math.random()*900000+100000); localStorage.setItem('earn_user',userId);
let curCat='All';
function openPage(p){ document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active')); document.getElementById('page-'+p).classList.add('active'); document.getElementById('t-'+p).classList.add('active'); if(p==='earn') renderApps(curCat); updateBal(); }
function openCategory(c){ curCat=c; openPage('earn'); }

function renderApps(cat){
  document.getElementById('filterInfo').innerText = cat==='All'? "Sabhi Apps - 310 (Sirf 9 par Earning)" : cat + " Category";
  let f = cat==='All'? APP_DATA : APP_DATA.filter(a=>a.c===cat);
  document.getElementById('appList').innerHTML = f.map(a=>{
    let canEarn = EARNING_APP_IDS.includes(a.id);
    return `<div class="app"><img src="${a.icon}"><div style="flex:1"><b>${a.name}</b><br><small>${a.c} ${canEarn? '• Earning App' : ''}</small></div>${canEarn? `<button style="background:#00ff88;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:bold" onclick="claimApp(${a.id},'${a.pkg}')">Earn ₹${a.reward}</button>` : `<button style="background:#222;color:#888;border:1px solid #333;padding:8px 14px;border-radius:20px" onclick="window.open('https://play.google.com/store/apps/details?id=${a.pkg}','_blank')">Install</button>`}</div>`;
  }).join('');
}

async function updateBal(){ try{ const r=await fetch(API_BASE+'/api/wallet/'+userId); const d=await r.json(); document.getElementById('balHead').innerText='₹'+d.balance; document.getElementById('bigBal').innerText='₹'+d.balance; }catch(e){} }
async function claimApp(appId,pkg){ window.open('https://play.google.com/store/apps/details?id='+pkg,'_blank'); if(!confirm('App Install kiya? OK dabane par Ad ke baad paisa milega.')) return; const res=await fetch(API_BASE+'/api/tasks/verify-ad',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,appId,adWatched:true})}); const data=await res.json(); alert(data.success?`₹${data.reward} Mil Gaya!` : data.message); updateBal(); }
async function doWithdraw(){ const upi=document.getElementById('upi').value; const amt=parseInt(document.getElementById('amt').value); const res=await fetch(API_BASE+'/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,upiId:upi,amount:amt})}); const d=await res.json(); document.getElementById('wMsg').innerText=d.message||d.error; updateBal(); }
async function loadAdmin(){ const key=document.getElementById('adminKey').value; const r=await fetch(API_BASE+'/api/admin/withdrawals?key='+key); const data=await r.json(); if(data.error) return alert(data.error); document.getElementById('adminBody').innerHTML=data.map(x=>`<tr><td>${x.id}</td><td>${x.user_id.slice(0,7)}</td><td>₹${x.amount}</td><td>${x.upi_id}</td><td>${x.status}</td></tr>`).join(''); }
updateBal(); renderApps('All');
</script></body></html>
